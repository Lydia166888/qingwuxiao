<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="青梧笑">
<meta name="theme-color" content="#FF6B9D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<title>青梧笑</title>
<style>
:root{
--primary:#FF6B9D;--primary-dark:#E63976;--primary-light:#FFE4EC;--primary-lighter:#FFF0F5;
--accent:#FFD93D;--accent-light:#FFF9E0;--accent-dark:#F9A825;
--bg:#FFF5F7;--bg2:#FFF0E8;--card:#fff;--text:#4A3F3F;--text-light:#8D7E7E;--text-lighter:#B8A8A8;
--border:#FCE4EC;--success:#66BB6A;--warning:#FFA726;--danger:#EF5350;
--shadow:0 4px 16px rgba(255,107,157,.12);--shadow-soft:0 2px 8px rgba(255,107,157,.08);
--radius:20px;--radius-sm:12px;--radius-lg:28px;--nav-w:72px;--header-h:56px;
--jelly:rgba(255,255,255,.72);--jelly-bd:rgba(255,107,157,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
input,textarea,button,select{font-family:inherit;font-size:inherit;border:none;outline:none}
a{color:var(--primary-dark);text-decoration:none}
ul{list-style:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:row;position:relative;background:var(--bg);box-shadow:0 0 40px rgba(255,107,157,.1)}
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}

/* Splash - 粉黄梦幻渐变 */
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#FF6B9D 0%,#FF8FAB 30%,#FFB088 60%,#FFD93D 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;transition:opacity .5s,visibility .5s;overflow-y:auto}
.splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-top{font-size:15px;opacity:1;letter-spacing:1px;margin-bottom:6px;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.splash-weather{display:flex;align-items:center;gap:8px;font-size:15px;opacity:1;margin-bottom:16px;background:rgba(255,255,255,.2);padding:6px 16px;border-radius:20px;backdrop-filter:blur(8px)}
.splash-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.splash-greeting{font-size:28px;font-weight:700;margin-bottom:10px;letter-spacing:1px}
.splash-quote{font-size:16px;font-weight:600;margin-bottom:8px;max-width:300px;line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.splash-sub{font-size:13px;opacity:1;margin-bottom:16px;text-shadow:0 1px 3px rgba(0,0,0,.12)}
.splash-almanac{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:16px;padding:12px 18px;margin-bottom:24px;max-width:320px;border:1px solid rgba(255,255,255,.2)}
.splash-almanac .sa-row{display:flex;gap:16px;justify-content:center}
.splash-almanac .sa-item{display:flex;align-items:center;gap:4px;font-size:14px}
.splash-almanac .sa-label{font-size:12px;opacity:1;margin-right:2px}
.splash-almanac .sa-yi{color:#FFF9C4}
.splash-almanac .sa-ji{color:#FFCDD2}
.splash-btn{background:#fff;color:var(--primary-dark);border:none;border-radius:30px;padding:13px 44px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:8px;transition:transform .2s}
.splash-btn:active{transform:scale(.96)}
.splash-hint{font-size:11px;opacity:.7}

/* Side Nav */
.side-nav{width:var(--nav-w);background:var(--jelly);backdrop-filter:blur(16px);border-right:1px solid var(--jelly-bd);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0 8px;z-index:20;overflow-y:auto}
.side-nav::-webkit-scrollbar{width:0}
.nav-logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 4px 12px rgba(255,107,157,.3);flex-shrink:0}
.nav-item{width:54px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-light);cursor:pointer;transition:all .2s;position:relative;border-radius:14px;margin-bottom:5px;flex-shrink:0}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active{color:var(--primary-dark);background:var(--primary-light)}
.nav-item:active{transform:scale(.92)}
.nav-fav{margin-top:auto;width:54px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent-dark);cursor:pointer;border-radius:14px;flex-shrink:0}
.nav-fav:active{transform:scale(.92)}
.nav-fav .nav-icon{font-size:18px}
.nav-fav .nav-label{font-size:9px}

/* Header */
.header{height:var(--header-h);background:var(--jelly);backdrop-filter:blur(12px);border-bottom:1px solid var(--jelly-bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:relative;z-index:10}
.header .title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.header .title::before{content:'✿';color:var(--primary);font-size:16px}
.header .date-bar{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--primary-lighter);border-radius:20px;padding:4px 8px}
.header .date-bar .arrow{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--primary);cursor:pointer;font-size:16px;box-shadow:var(--shadow-soft)}
.header .date-bar .arrow:active{background:var(--primary-light)}
.header .date-bar .date-text{min-width:90px;text-align:center;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px}
.header .date-bar .date-text::after{content:'▾';font-size:9px;color:var(--primary);opacity:.6}
.header .today-btn{font-size:11px;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:12px;cursor:pointer}

/* Calendar */
.cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:250;display:none;align-items:flex-start;justify-content:center;padding-top:56px}
.cal-overlay.show{display:flex;animation:calFade .18s}
@keyframes calFade{from{opacity:0}to{opacity:1}}
.cal-box{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.15);width:330px;max-width:92vw;padding:18px;animation:calSlide .22s}
@keyframes calSlide{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .cal-ym{font-size:16px;font-weight:700;color:var(--text)}
.cal-head .cal-nav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--primary);cursor:pointer;font-size:17px}
.cal-head .cal-nav:active{background:var(--primary-light)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-light);margin-bottom:6px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;font-size:13px;color:var(--text);cursor:pointer;position:relative;transition:background .15s}
.cal-cell:active{background:var(--primary-light)}
.cal-cell.other{color:var(--text-light);opacity:.35}
.cal-cell.today{color:var(--primary);font-weight:700}
.cal-cell.today::before{content:'';position:absolute;inset:3px;border:1.5px solid var(--primary);border-radius:9px}
.cal-cell.selected{background:var(--primary);color:#fff;font-weight:700}
.cal-cell.selected::before{display:none}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-cell.selected .cal-dot{background:#fff}
.cal-foot{display:flex;gap:8px;margin-top:16px}
.cal-foot .btn{flex:1}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
.content::-webkit-scrollbar{width:0}
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--jelly);backdrop-filter:blur(10px);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title .icon{font-size:18px}
.card-title .more{font-size:12px;color:var(--text-lighter);margin-left:auto;cursor:pointer}

/* Hero */
.hero-card{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:22px 18px;color:#fff;box-shadow:0 8px 24px rgba(255,107,157,.2);margin-bottom:14px;position:relative;overflow:hidden}
.hero-card::before{content:'✿';position:absolute;right:14px;top:14px;font-size:60px;opacity:.12}
.hero-date{font-size:12px;opacity:.9;margin-bottom:6px}
.hero-greeting{font-size:22px;font-weight:700;margin-bottom:6px}
.hero-quote{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:14px}
.hero-row{display:flex;align-items:center;justify-content:space-between}
.hero-progress{position:relative;width:70px;height:70px}
.hero-progress svg{transform:rotate(-90deg)}
.hero-progress .ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:7}
.hero-progress .ring-fg{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.hero-progress .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700}
.hero-info{flex:1;padding-right:12px}
.hero-info .done-text{font-size:13px;opacity:.9}
.hero-info .streak{font-size:12px;opacity:.8;margin-top:4px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.stat-card .sc-icon{font-size:26px;margin-bottom:4px}
.stat-card .sc-num{font-size:22px;font-weight:700;color:var(--text)}
.stat-card .sc-label{font-size:11px;color:var(--text-light);margin-top:2px}
.stat-card.done .sc-num{color:var(--success)}
.stat-card.warn .sc-num{color:var(--accent-dark)}

/* Section title */
.section-title{font-size:13px;font-weight:700;color:var(--text-light);margin:18px 0 10px;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.section-title .count{font-size:11px;color:var(--text-lighter);font-weight:500}

/* Completion grid */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comp-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.comp-card:active{transform:scale(.97)}
.comp-card .cc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-light)}
.comp-card .cc-info{flex:1;min-width:0}
.comp-card .cc-name{font-size:13px;font-weight:600}
.comp-card .cc-status{font-size:11px;color:var(--text-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card .cc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:12px}
.comp-card.done .cc-check{background:var(--success);border-color:var(--success);color:#fff}

/* Inputs */
.input,.textarea,.select{width:100%;background:var(--primary-lighter);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text);transition:border .2s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary)}
.textarea{resize:vertical;min-height:70px;line-height:1.6}
.input-group{margin-bottom:10px}
.input-group label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;box-shadow:0 3px 10px rgba(255,107,157,.2)}
.btn-primary:active{transform:scale(.96)}
.btn-yellow{background:linear-gradient(135deg,var(--accent),#FFE082);color:#5D4037;box-shadow:0 3px 10px rgba(255,213,79,.2)}
.btn-yellow:active{transform:scale(.96)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary-dark)}
.btn-outline:active{background:var(--primary-light)}
.btn-ghost{background:var(--primary-light);color:var(--primary-dark)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%}
.btn:active{transform:scale(.96)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--primary-lighter);color:var(--text-light);cursor:pointer;border:1px solid transparent;transition:all .2s}
.chip.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;border-color:transparent}
.chip.yellow-active{background:var(--accent);color:#5D4037}

/* Sub tabs */
.sub-tab-row{display:flex;gap:6px;margin-bottom:12px;background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:4px;border:1px solid var(--jelly-bd)}
.sub-tab{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s}
.sub-tab:active{transform:scale(.94)}
.sub-tab.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;font-weight:500;box-shadow:0 3px 8px rgba(255,107,157,.2)}

/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.todo-item:last-child{border-bottom:none}
.todo-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.todo-checkbox.checked{background:var(--success);border-color:var(--success)}
.todo-checkbox.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.todo-content{flex:1;min-width:0}
.todo-text{font-size:13px;line-height:1.5}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-lighter)}
.todo-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;margin-left:4px}
.todo-tag.urgent{background:#FFEBEE;color:#C62828}
.todo-tag.important{background:var(--primary-light);color:var(--primary-dark)}
.todo-tag.normal{background:var(--accent-light);color:var(--accent-dark)}
.todo-del{color:var(--text-lighter);font-size:16px;cursor:pointer;padding:4px}
.todo-del:active{color:var(--danger)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1.5px dashed #f2d0d8;border-radius:var(--radius-sm);color:var(--text-light);font-size:13px;cursor:pointer;transition:all .2s;margin-top:8px;background:var(--jelly)}
.add-btn:active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* Quadrant */
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quadrant{border-radius:var(--radius-sm);padding:12px;min-height:120px;display:flex;flex-direction:column}
.quadrant.q1{background:linear-gradient(135deg,#FFE4EC,#FFF0F5)}
.quadrant.q2{background:linear-gradient(135deg,#FFF9E0,#FFFDE7)}
.quadrant.q3{background:linear-gradient(135deg,#E8F5E9,#F1F8E9)}
.quadrant.q4{background:linear-gradient(135deg,#E3F2FD,#F3E5F5)}
.quadrant .q-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.quadrant .q-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.quadrant .q-sub{font-size:10px;color:var(--text-light);margin-top:2px}
.quadrant .q-add-btn{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-light);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);flex-shrink:0}
.quadrant .q-list{flex:1;font-size:12px;color:var(--text);line-height:1.6}
.quadrant .q-empty{text-align:center;color:var(--text-lighter);font-size:11px;padding-top:16px}
.quadrant .q-item{display:flex;align-items:center;gap:4px;padding:3px 0}
.quadrant .q-item .q-del{color:var(--text-lighter);cursor:pointer;font-size:13px;margin-left:auto}

/* Plan */
.plan-summary-card{padding:16px}
.plan-summary-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plan-summary-title{font-size:18px;font-weight:700}
.plan-summary-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.plan-progress-box{flex:1;max-width:180px;margin-left:16px}
.plan-progress-box .ppb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-bottom:5px}
.plan-progress-box .ppb-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.plan-progress-box .ppb-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .3s}

/* Meal */
.meal-tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.meal-tab{flex:1;min-width:70px;text-align:center;padding:10px 8px;background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;box-shadow:var(--shadow-soft);border:2px solid transparent}
.meal-tab.active{border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.meal-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-soft);margin-bottom:12px;border:1px solid var(--jelly-bd)}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.meal-name{font-size:15px;font-weight:700}
.meal-cal{font-size:12px;color:var(--accent-dark);font-weight:600}
.meal-upload{width:100%;height:100px;border:2px dashed #f0d0d8;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-lighter);font-size:28px;cursor:pointer;overflow:hidden;background:var(--primary-lighter);margin-bottom:10px;position:relative}
.meal-upload img{width:100%;height:100%;object-fit:cover}
.meal-upload .del-img{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}

/* Finance */
.finance-hero{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:18px;color:#fff;margin-bottom:14px}
.finance-hero .fh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.finance-hero .fh-label{font-size:12px;opacity:.9}
.finance-hero .fh-amount{font-size:28px;font-weight:700}
.finance-hero .fh-budget{font-size:12px;opacity:.85}
.fh-budget-bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:8px}
.fh-budget-bar .fill{height:100%;background:#fff;border-radius:4px;transition:width .3s}
.fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fin-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.fin-card .fin-label{font-size:10px;color:var(--text-light)}
.fin-card .fin-num{font-size:16px;font-weight:700;margin-top:4px}
.fin-card.income .fin-num{color:var(--success)}
.fin-card.expense .fin-num{color:var(--danger)}
.fin-card.balance .fin-num{color:var(--accent-dark)}

.word-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.word-card:active{transform:scale(.99)}

.word-card .w-phonetic{font-size:13px;color:var(--accent-dark);margin:6px 0}
.word-card .w-meaning{font-size:13px;color:var(--text-light)}
.word-example{background:var(--primary-light);border-radius:var(--radius-sm);padding:12px;margin-top:10px;display:none}
.word-example.show{display:block}
.word-game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.word-game-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:16px 10px;text-align:center;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.word-game-card:active{transform:scale(.96)}
.word-game-card .wg-icon{font-size:32px;margin-bottom:6px}
.word-game-card .wg-name{font-size:13px;font-weight:600}
.word-game-card .wg-desc{font-size:11px;color:var(--text-light);margin-top:2px}

/* Exercise */
.exercise-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.exercise-item:last-child{border-bottom:none}
.exercise-check{width:22px;height:22px;border-radius:6px;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.exercise-check.checked{background:var(--success);border-color:var(--success)}
.exercise-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.exercise-info{flex:1}
.exercise-name{font-size:13px;font-weight:600}
.exercise-meta{font-size:11px;color:var(--text-light);margin-top:2px}
.exercise-link{font-size:11px;color:var(--primary-dark);margin-top:2px}

.cc-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.cc-card:active{transform:scale(.99)}
.cc-tags{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.cc-tag{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.cc-tag.xhs{background:#FF2442;color:#fff}
.cc-tag.dy{background:#000;color:#fff}
.cc-tag.wx{background:#07C160;color:#fff}
.cc-tag.bili{background:#FB7299;color:#fff}
.cc-tag.bd{background:#4E6EF2;color:#fff}
.cc-tag.cat{background:var(--primary-light);color:var(--primary-dark)}
.cc-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:4px}
.cc-desc{font-size:12px;color:var(--text-light);line-height:1.6}
.cc-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cc-link{font-size:11px;color:var(--primary-dark);cursor:pointer;display:flex;align-items:center;gap:3px}
.cc-fav{font-size:16px;cursor:pointer;transition:transform .15s}
.cc-fav:active{transform:scale(.8)}
.cc-fav.active{color:var(--accent-dark)}

.outfit-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}

.shop-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd);display:flex;align-items:center;gap:10px}

.travel-fund{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:20px;color:#fff;text-align:center;margin-bottom:14px}

.travel-fund .tf-bar .tf-fill{height:100%;background:#fff;border-radius:4px}
.travel-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.travel-card .tr-title{font-size:14px;font-weight:700;margin-bottom:4px}
.travel-card .tr-desc{font-size:12px;color:var(--text-light);line-height:1.6}
.travel-card .tr-budget{font-size:11px;color:var(--primary-dark);margin-top:6px}

/* Modal & Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,107,157,.95);color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}

.modal{background:#fff;border-radius:var(--radius);padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}

/* Favorites panel */
.fav-panel{position:fixed;top:0;right:0;width:300px;max-width:85vw;height:100%;background:var(--bg);z-index:280;transform:translateX(100%);transition:transform .3s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.1)}

.fav-panel .fp-title{font-size:16px;font-weight:700}
.fav-panel .fp-close{font-size:20px;cursor:pointer;color:var(--text-light)}
.fav-panel .fp-tabs{display:flex;gap:4px;padding:8px 16px;overflow-x:auto}

.fav-panel .fp-list{padding:8px 16px}
.fav-panel .fp-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-soft)}
.fav-panel .fp-item .fi-title{font-size:13px;font-weight:600;margin-bottom:4px}
.fav-panel .fp-item .fi-meta{font-size:11px;color:var(--text-light)}
.fav-panel .fp-item .fi-del{font-size:14px;color:var(--text-lighter);cursor:pointer;margin-top:4px}
.fav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:270;display:none}
.fav-overlay.show{display:block}

/* Empty */
.empty{text-align:center;padding:30px 20px;color:var(--text-lighter)}
.empty .empty-icon{font-size:42px;margin-bottom:8px}
.empty .empty-text{font-size:13px}

/* Badge */
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.badge.yellow{background:var(--accent-light);color:var(--accent-dark)}

/* Responsive */

function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`}
function todayStr(){return dateStr(new Date())}
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return dateStr(d)}
function weekNum(s){const d=new Date(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));const y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/864e5)+1)/7)}
function fmtDate(s){const d=new Date(s);const w=['日','一','二','三','四','五','六'];return`${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`}
function monthStr(s){return s.slice(0,7)}
function monthWeek(s){const d=new Date(s);return Math.ceil(d.getDate()/7)}
function $(id){return document.getElementById(id)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms||10)}catch(e){}}
function save(key,val){localStorage.setItem('qwx5_'+key,JSON.stringify(val))}

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function dayIdx(s){const d=new Date(s);return Math.floor((d-new Date('2024-01-01'))/864e5)}

async fetchWeather(lat,lon){
try{
const res=await fetch(`https://wttr.in/${lat},${lon}?format=%C+%t&lang=zh`);
const txt=await res.text();
const parts=txt.trim().split(/\s+/);
const rawCond=parts[0]||'晴';
const rawTemp=parts[1]||'--';
const temp=rawTemp.replace(/[+°C]/g,'').trim()||'--';
const condMap={'晴':'☀️','多云':'⛅','阴':'☁️','雨':'🌧','小雨':'🌦','中雨':'🌧','大雨':'⛈','暴雨':'⛈','雷阵雨':'⛈','雪':'❄️','小雪':'🌨','雾':'🌫','霾':'😷','沙尘':'🌪'};
let icon='🌤';
for(const k in condMap){if(rawCond.includes(k)){icon=condMap[k];break}}
const data={icon,temp,text:rawCond,city:'当前位置',date:todayStr()};
save('weather_cache',data);
$('splashWeather').innerHTML=`${data.icon} ${data.temp}° ${data.text} · 📍 ${data.city}`;
}catch(e){
const data={icon:'🌤',temp:'--',text:'天气获取失败',city:'点击重试',date:''};
$('splashWeather').innerHTML=`${data.icon} ${data.temp}° ${data.text} · 📍 ${data.city}`;
$('splashWeather').onclick=()=>{this.loadWeather()};
}
},

switchModule(p){this.currentPage=p;document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+p));this.renderPage(p);$('content').scrollTop=0},

renderCompCard(page,icon,name,status,pageId){

return`<div class="comp-card ${done?'done':''}" onclick="App.switchModule('${pageId}')"><div class="cc-icon">${icon}</div><div class="cc-info"><div class="cc-name">${name}</div><div class="cc-status">${status}</div></div><div class="cc-check">✓</div></div>`;

renderTodoItem(t,type,i){
return`<div class="todo-item ${t.done?'done':''}"><div class="todo-checkbox ${t.done?'checked':''}" onclick="App.toggleTodo('${type}',${i})"></div><div class="todo-content"><div class="todo-text">${escapeHtml(t.text)} <span class="todo-tag ${t.q||'normal'}">${this.qLabel(t.q)}</span></div></div><div class="todo-del" onclick="App.delTodo('${type}',${i})">×</div></div>`;

qLabel(q){return q==='urgent'?'紧急':(q==='important'?'重要':(q==='delegate'?'委托':'日常'))},
renderQuadrant(q,title,sub,color){
const d=this.dayData(this.currentDate);const items=d.quadrant?.[q]||[];
return`<div class="quadrant ${q}">
<div class="q-head"><div><div class="q-title" style="color:${color}">${title}</div><div class="q-sub">${sub}</div></div><div class="q-add-btn" onclick="App.addQuadrantItem('${q}')">+</div></div>
<div class="q-list">${items.length?items.map((item,i)=>`<div class="q-item">${escapeHtml(item)}<span class="q-del" onclick="App.delQuadrantItem('${q}',${i})">×</span></div>`).join(''):'<div class="q-empty">暂无</div>'}</div>
</div>`;
},
analyzeUndone(undone){
const urgent=undone.filter(t=>t.q==='urgent').length;
const important=undone.filter(t=>t.q==='important').length;
let tips=[];
if(urgent>0)tips.push(`有${urgent}项紧急任务未完成，可能是今天安排过满，建议把非紧急任务移到明天。`);
if(important>0)tips.push(`有${important}项重要任务未完成，重要任务建议安排在精力最好的上午时段。`);
if(undone.length>5)tips.push(`未完成${undone.length}项偏多，建议每天核心任务不超过3个，其余作为弹性任务。`);
if(!tips.length)tips.push('今日完成情况不错，个别任务未完成属正常，明天继续加油！');
return tips.join('<br>');
},

this.openModal('添加待办',`

delTodo(type,i){const d=this.dayData(this.currentDate);if(d.todos?.[type]){d.todos[type].splice(i,1);this.saveDay(this.currentDate,d);this.renderPage('plan');toast('已删除');haptic(20)}},
addQuadrantItem(q){

getTodayMenu(){

},
editMenu(field,val){

},
toggleMenuEdit(){this.menuEditing=!this.menuEditing;this.renderPage('diet')},

resetMenu(){

},
renderMealCard(meal,label){

html+=`<div class="fp-tabs">${types.map(t=>`<div class="fp-tab ${this.favTab===t.k?'active':''}" onclick="App.setFavTab('${t.k}')">${t.n}</div>`).join('')}</div>`;
const fav=load('favs_'+this.favTab,[]);
html+=`<div class="fp-list">${fav.length?fav.map((f,i)=>`<div class="fp-item"><div class="fi-title">${escapeHtml(f.title)}</div>${f.desc?`<div class="fi-meta">${escapeHtml(f.desc)}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><a href="${f.link||'#'}" target="_blank" style="font-size:11px;color:var(--primary-dark)">查看原文 →</a><span class="fi-del" onclick="App.delFav('${this.favTab}',${i})">删除</span></div></div>`).join(''):'<div class="empty"><div class="empty-icon">⭐</div><div class="empty-text">暂无收藏</div></div>'}</div>`;
$('favPanel').innerHTML=html;$('favPanel').classList.add('show');$('favOverlay').classList.add('show');
},
closeFavPanel(){$('favPanel').classList.remove('show');$('favOverlay').classList.remove('show')},
setFavTab(t){this.favTab=t;this.openFavPanel()},
delFav(type,i){const fav=load('favs_'+type,[]);fav.splice(i,1);save('favs_'+type,fav);this.openFavPanel();toast('已删除');haptic(15)},

/* === HELPERS === */
calcStreak(){let s=0;let d=todayStr();while(1){const dd=this.dayData(d);const total=(dd.todos?.work?.length||0)+(dd.todos?.personal?.length||0);const done=(dd.todos?.work?.filter(t=>t.done).length||0)+(dd.todos?.personal?.filter(t=>t.done).length||0);if(total>0&&done===total)s++;else if(d===todayStr()){}else break;d=addDays(d,-1);if(s>30)break}return s},
getTodaySpend(){const d=this.dayData(this.currentDate);return(d.finance||[]).filter(i=>i.type!=='income').reduce((a,b)=>a+(+b.amount||0),0)},
getMealCount(){const d=this.dayData(this.currentDate);return Object.values(d.diet||{}).filter(m=>m.name||m.img).length},
getExerciseMin(){const d=this.dayData(this.currentDate);const done=d.exerciseDone||{};const types=load('exerciseTypes',EXERCISE_TYPES);let m=0;for(const k in done){const item=this.findExerciseItem(k,types);if(item)m+=item.min}return m},
exerciseDone(){const d=this.dayData(this.currentDate);return!!(d.exerciseDone&&Object.keys(d.exerciseDone).length)},
calcExerciseStreak(){let s=0;let d=todayStr();while(1){const dd=this.dayData(d);if(dd.exerciseDone&&Object.keys(dd.exerciseDone).length)s++;else if(d===todayStr()){}else break;d=addDays(d,-1);if(s>30)break}return s},
updateHome(){if(this.currentPage==='home')this.renderPage('home')},
openModal(title,html){$('modalContent').innerHTML=`<div class="modal-title">${title}</div>${html}`;$('modalOverlay').classList.add('show')},
closeModal(e){if(e&&e.target!==$('modalOverlay'))return;$('modalOverlay').classList.remove('show')},
bindKeys(){document.addEventListener('keydown',e=>{if(e.key==='Escape'){this.closeModal();this.closeFavPanel()}})}
};
App.init();
</script>
