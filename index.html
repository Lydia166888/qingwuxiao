<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="青梧笑">
<meta name="theme-color" content="#FF8FAB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<title>青梧笑</title>
<style>
:root{
  --primary:#FF8FAB;--primary-dark:#FF6B8B;--primary-light:#FFE4EC;
  --accent:#FFD93D;--accent-light:#FFF9E0;--accent-dark:#F9A825;
  --bg:#FFF5F7;--card:#fff;--text:#4A3F3F;--text-light:#8D7E7E;--text-lighter:#B8A8A8;
  --border:#FCE4EC;--success:#81C784;--warning:#FFB74D;--danger:#E57373;
  --shadow:0 4px 16px rgba(255,143,171,.1);--shadow-soft:0 2px 8px rgba(255,143,171,.08);
  --radius:20px;--radius-sm:12px;--radius-lg:28px;
  --nav-w:72px;--header-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
input,textarea,button,select{font-family:inherit;font-size:inherit;border:none;outline:none}
a{color:var(--primary-dark);text-decoration:none}
ul{list-style:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:row;position:relative;background:var(--bg);box-shadow:0 0 40px rgba(255,143,171,.12)}
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}

/* Side Nav */
.side-nav{width:var(--nav-w);background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0 8px;z-index:20;overflow-y:auto}
.side-nav::-webkit-scrollbar{width:0}
.nav-logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 4px 12px rgba(255,143,171,.3);flex-shrink:0}
.nav-item{width:54px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-light);cursor:pointer;transition:all .2s;position:relative;border-radius:14px;margin-bottom:5px;flex-shrink:0}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active{color:var(--primary-dark);background:var(--primary-light)}
.nav-item:active{transform:scale(.95)}
.nav-item .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent-dark);border:1.5px solid #fff}

/* Header */
.header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:relative;z-index:10}
.header .title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.header .title::before{content:'✿';color:var(--primary);font-size:16px}
.header .date-bar{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);border-radius:20px;padding:4px 8px}
.header .date-bar .arrow{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--primary);cursor:pointer;font-size:16px;box-shadow:var(--shadow-soft)}
.header .date-bar .arrow:active{background:var(--primary-light)}
.header .date-bar .date-text{min-width:90px;text-align:center;font-weight:600;color:var(--text)}
.header .today-btn{font-size:11px;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:12px;cursor:pointer}
.header .date-bar .date-text{cursor:pointer;display:flex;align-items:center;gap:4px}
.header .date-bar .date-text::after{content:'▾';font-size:9px;color:var(--primary);opacity:.6}
/* Calendar overlay */
.cal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:250;display:none;align-items:flex-start;justify-content:center;padding-top:56px}
.cal-overlay.show{display:flex;animation:calFade .18s}
@keyframes calFade{from{opacity:0}to{opacity:1}}
.cal-box{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.15);width:330px;max-width:92vw;padding:18px;animation:calSlide .22s}
@keyframes calSlide{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .cal-ym{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.5px}
.cal-head .cal-nav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--primary);cursor:pointer;font-size:17px}
.cal-head .cal-nav:active{background:var(--primary-light)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-light);margin-bottom:6px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;font-size:13px;color:var(--text);cursor:pointer;position:relative;transition:background .15s;line-height:1}
.cal-cell:active{background:var(--primary-light)}
.cal-cell.other{color:var(--text-light);opacity:.35}
.cal-cell.today{color:var(--primary);font-weight:700}
.cal-cell.today::before{content:'';position:absolute;inset:3px;border:1.5px solid var(--primary);border-radius:9px}
.cal-cell.selected{background:var(--primary);color:#fff;font-weight:700}
.cal-cell.selected::before{display:none}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-cell.selected .cal-dot{background:#fff}
.cal-foot{display:flex;gap:8px;margin-top:16px}
.cal-foot .btn{flex:1}
.cal-foot .btn-sm{padding:8px 0;font-size:13px}

/* Splash */
.splash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:linear-gradient(180deg,var(--primary) 0%,#FFC46B 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px 30px;transition:opacity .5s,visibility .5s}
.splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-date{font-size:14px;opacity:.9;margin-bottom:30px;letter-spacing:1px}
.splash-avatar{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:24px;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.splash-greeting{font-size:32px;font-weight:700;margin-bottom:14px;letter-spacing:1px}
.splash-quote{font-size:16px;font-weight:500;margin-bottom:10px;max-width:280px;line-height:1.5;min-height:48px}
.splash-sub{font-size:13px;opacity:.85;margin-bottom:50px}
.splash-btn{background:#fff;color:var(--primary-dark);border:none;border-radius:30px;padding:14px 48px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.1);margin-bottom:12px;transition:transform .2s}
.splash-btn:active{transform:scale(.98)}
.splash-hint{font-size:12px;opacity:.75}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
.content::-webkit-scrollbar{width:0}
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title .icon{font-size:18px}
.card-title .more{font-size:12px;color:var(--text-lighter);margin-left:auto;cursor:pointer}

/* Hero Card */
.hero-card{background:linear-gradient(135deg,var(--primary) 0%,#FFC46B 100%);border-radius:var(--radius-lg);padding:22px 18px;color:#fff;box-shadow:0 8px 24px rgba(255,143,171,.25);margin-bottom:14px;position:relative;overflow:hidden}
.hero-card::before{content:'✿';position:absolute;right:14px;top:14px;font-size:60px;opacity:.12}
.hero-date{font-size:12px;opacity:.9;margin-bottom:6px}
.hero-greeting{font-size:22px;font-weight:700;margin-bottom:6px}
.hero-quote{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:14px}
.hero-row{display:flex;align-items:center;justify-content:space-between}
.hero-progress{position:relative;width:70px;height:70px}
.hero-progress svg{transform:rotate(-90deg)}
.hero-progress .ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:7}
.hero-progress .ring-fg{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.hero-progress .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700}
.hero-info{flex:1;padding-right:12px}
.hero-info .done-text{font-size:13px;opacity:.9}
.hero-info .streak{font-size:12px;opacity:.8;margin-top:4px}

/* Quick Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow-soft)}
.stat-card .sc-icon{font-size:26px;margin-bottom:4px}
.stat-card .sc-num{font-size:22px;font-weight:700;color:var(--text)}
.stat-card .sc-label{font-size:11px;color:var(--text-light);margin-top:2px}
.stat-card.done .sc-num{color:var(--success)}
.stat-card.warn .sc-num{color:var(--accent-dark)}

/* Section title */
.section-title{font-size:13px;font-weight:700;color:var(--text-light);margin:18px 0 10px;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.section-title .count{font-size:11px;color:var(--text-lighter);font-weight:500}

/* Completion grid */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comp-card{background:#fff;border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-soft);cursor:pointer;transition:all .2s}
.comp-card:active{transform:scale(.97)}
.comp-card .cc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-light)}
.comp-card .cc-info{flex:1;min-width:0}
.comp-card .cc-name{font-size:13px;font-weight:600}
.comp-card .cc-status{font-size:11px;color:var(--text-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card .cc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:12px}
.comp-card.done .cc-check{background:var(--success);border-color:var(--success);color:#fff}

/* Inputs */
.input,.textarea,.select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text);transition:border .2s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary)}
.textarea{resize:vertical;min-height:70px;line-height:1.6}
.input-group{margin-bottom:10px}
.input-group label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-dark)}
.btn-yellow{background:var(--accent);color:#5D4037}
.btn-yellow:active{background:var(--accent-dark)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary-dark)}
.btn-outline:active{background:var(--primary-light)}
.btn-ghost{background:var(--primary-light);color:var(--primary-dark)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%}
.btn:active{transform:scale(.97)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 14px;border-radius:16px;font-size:12px;background:#f8f0f2;color:var(--text-light);cursor:pointer;border:1px solid transparent;transition:all .2s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.yellow-active{background:var(--accent);color:#5D4037;border-color:var(--accent)}
.chip.outline-active{background:#fff;color:var(--primary);border-color:var(--primary)}

/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.todo-item:last-child{border-bottom:none}
.todo-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.todo-checkbox.checked{background:var(--success);border-color:var(--success)}
.todo-checkbox.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.todo-content{flex:1;min-width:0}
.todo-text{font-size:13px;line-height:1.5}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-lighter)}
.todo-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;margin-left:4px}
.todo-tag.urgent{background:#FFEBEE;color:#C62828}
.todo-tag.important{background:var(--primary-light);color:var(--primary-dark)}
.todo-tag.normal{background:var(--accent-light);color:var(--accent-dark)}
.todo-del{color:var(--text-lighter);font-size:16px;cursor:pointer;padding:4px}
.todo-del:active{color:var(--danger)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1.5px dashed #f2d0d8;border-radius:var(--radius-sm);color:var(--text-light);font-size:13px;cursor:pointer;transition:all .2s;margin-top:8px;background:#fff}
.add-btn:active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* Quadrant */
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quadrant{border-radius:var(--radius-sm);padding:12px;min-height:150px;display:flex;flex-direction:column}
.quadrant .q-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.quadrant .q-title{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.quadrant .q-sub{font-size:11px;color:var(--text-light);margin-top:2px}
.quadrant .q-add-btn{width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-light);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);flex-shrink:0}
.quadrant .q-add-btn:active{transform:scale(.92)}
.quadrant .q-list{flex:1;font-size:12px;color:var(--text);line-height:1.6;overflow-y:auto}
.quadrant .q-empty{text-align:center;color:var(--text-lighter);font-size:12px;padding-top:24px}
.quadrant .q-edit-item{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.quadrant .q-edit-item .q-del{color:var(--text-lighter);cursor:pointer;font-size:14px;padding:0 4px}

/* Plan summary */
.plan-summary-card{padding:16px}
.plan-summary-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plan-summary-title{font-size:18px;font-weight:700}
.plan-summary-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.plan-progress-box{flex:1;max-width:180px;margin-left:16px}
.plan-progress-box .ppb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-bottom:5px}
.plan-progress-box .ppb-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.plan-progress-box .ppb-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .3s}
.plan-add-new{width:100%;padding:11px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.plan-add-new:active{transform:scale(.99)}
.quadrant-wrap{padding:12px}

/* Meal */
.meal-tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.meal-tab{flex:1;min-width:70px;text-align:center;padding:10px 8px;background:#fff;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;box-shadow:var(--shadow-soft);border:2px solid transparent}
.meal-tab.active{border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.meal-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-soft);margin-bottom:12px}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.meal-name{font-size:15px;font-weight:700}
.meal-cal{font-size:12px;color:var(--text-light)}
.meal-upload{width:100%;height:120px;border:2px dashed #f0d0d8;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-lighter);font-size:28px;cursor:pointer;overflow:hidden;background:var(--bg);margin-bottom:10px;position:relative}
.meal-upload img{width:100%;height:100%;object-fit:cover}
.meal-upload .del-img{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}

/* Finance */
.finance-hero{background:linear-gradient(135deg,var(--primary) 0%,#FFC46B 100%);border-radius:var(--radius-lg);padding:18px;color:#fff;margin-bottom:14px}
.finance-hero .fh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.finance-hero .fh-label{font-size:12px;opacity:.9}
.finance-hero .fh-amount{font-size:28px;font-weight:700}
.finance-hero .fh-budget{font-size:12px;opacity:.85}
.budget-bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:8px}
.budget-bar .budget-fill{height:100%;background:#fff;border-radius:4px;transition:width .3s}
.fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fin-card{background:#fff;border-radius:var(--radius-sm);padding:12px 8px;text-align:center;box-shadow:var(--shadow-soft)}
.fin-card .fin-label{font-size:10px;color:var(--text-light)}
.fin-card .fin-num{font-size:16px;font-weight:700;margin-top:4px}
.fin-card.income .fin-num{color:var(--success)}
.fin-card.expense .fin-num{color:var(--danger)}
.fin-card.balance .fin-num{color:var(--accent-dark)}

/* Word learning */
.lang-hero{background:linear-gradient(135deg,#A1C4FD 0%,#C2E9FB 100%);border-radius:var(--radius-lg);padding:18px;color:#2c4a5e;margin-bottom:14px}
.lang-hero .lh-title{font-size:15px;font-weight:700;margin-bottom:6px}
.lang-hero .lh-desc{font-size:12px;opacity:.8;line-height:1.5}
.lang-hero .lh-chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.lang-hero .lh-chip{background:rgba(255,255,255,.6);padding:5px 10px;border-radius:12px;font-size:11px;color:#2c4a5e}
.word-date-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.word-date-chip{min-width:64px;text-align:center;padding:8px 10px;background:#fff;border-radius:14px;font-size:12px;color:var(--text-light);cursor:pointer;box-shadow:var(--shadow-soft);border:1.5px solid transparent;flex-shrink:0}
.word-date-chip.active{border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.word-card{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-soft);cursor:pointer;transition:all .2s}
.word-card:active{transform:scale(.99)}
.word-card .w-word{font-size:22px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.word-card .w-phonetic{font-size:13px;color:var(--accent-dark);margin:6px 0}
.word-card .w-meaning{font-size:13px;color:var(--text-light)}
.word-card .w-actions{display:flex;gap:8px;margin-top:12px}
.word-example{background:var(--primary-light);border-radius:var(--radius-sm);padding:12px;margin-top:10px;display:none}
.word-example.show{display:block}
.word-example .ex-line{font-size:13px;color:var(--primary-dark);margin-bottom:4px}
.word-example .ex-cn{font-size:12px;color:var(--text-light)}
.word-game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.word-game-card{background:#fff;border-radius:var(--radius);padding:16px 10px;text-align:center;box-shadow:var(--shadow-soft);cursor:pointer}
.word-game-card .wg-icon{font-size:32px;margin-bottom:6px}
.word-game-card .wg-name{font-size:13px;font-weight:600}
.word-game-card .wg-desc{font-size:11px;color:var(--text-light);margin-top:2px}

/* Exercise */
.exercise-hero{background:linear-gradient(135deg,#89CFF0 0%,#B2EBF2 100%);border-radius:var(--radius-lg);padding:18px;color:#1a4a5e;margin-bottom:14px;text-align:center}
.exercise-hero .eh-title{font-size:15px;font-weight:700;margin-bottom:4px}
.exercise-hero .eh-sub{font-size:12px;opacity:.8}
.exercise-hero .eh-stats{display:flex;justify-content:space-around;margin:14px 0}
.exercise-hero .eh-stat .num{font-size:26px;font-weight:700}
.exercise-hero .eh-stat .lbl{font-size:10px;opacity:.8}
.exercise-hero .eh-btn{background:#fff;color:#1a4a5e;padding:10px 24px;border-radius:20px;font-weight:600;display:inline-block;cursor:pointer}
.exercise-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f4f5}
.exercise-item:last-child{border-bottom:none}
.exercise-check{width:22px;height:22px;border-radius:6px;border:2px solid #c8e0e8;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.exercise-check.checked{background:var(--success);border-color:var(--success)}
.exercise-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.exercise-info{flex:1}
.exercise-name{font-size:13px;font-weight:600}
.exercise-meta{font-size:11px;color:var(--text-light);margin-top:2px}
.exercise-link{font-size:11px;color:#1a7a9e;margin-top:2px}

/* Collapsible */
.collapse-item{background:#fff;border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-soft)}
.collapse-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.collapse-header .ch-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.collapse-header .ch-arrow{transition:transform .2s;color:var(--text-light)}
.collapse-item.open .ch-arrow{transform:rotate(180deg)}
.collapse-body{padding:0 14px 14px;font-size:12px;color:var(--text-light);line-height:1.7;display:none}
.collapse-item.open .collapse-body{display:block}

/* News */
.news-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.news-tab{min-width:64px;text-align:center;padding:7px 12px;background:#fff;border-radius:14px;font-size:12px;color:var(--text-light);cursor:pointer;box-shadow:var(--shadow-soft);flex-shrink:0;border:1.5px solid transparent}
.news-tab.active{border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.news-item{padding:12px 0;border-bottom:1px solid #f9eef1}
.news-item:last-child{border-bottom:none}
.news-item .news-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;margin-bottom:5px}
.news-item .news-title{font-size:13px;font-weight:500;line-height:1.5}
.news-item .news-link{font-size:11px;color:var(--primary-dark);margin-top:4px;display:block}

/* Invest */
.tip-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent)}
.tip-card .tip-title{font-size:14px;font-weight:700;margin-bottom:4px}
.tip-card .tip-body{font-size:12px;color:var(--text-light);line-height:1.6}
.tip-card .tip-link{font-size:11px;color:var(--primary-dark);margin-top:6px;display:block}
.goal-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft)}
.goal-card .goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.goal-card .goal-name{font-size:14px;font-weight:600}
.goal-card .goal-amt{font-size:12px;color:var(--text-light)}
.goal-card .goal-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.goal-card .goal-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px}

/* AI */
.ai-hero{background:linear-gradient(135deg,#667EEA 0%,#764BA2 100%);border-radius:var(--radius-lg);padding:18px;color:#fff;margin-bottom:14px}
.ai-hero .ai-title{font-size:16px;font-weight:700;margin-bottom:6px}
.ai-hero .ai-desc{font-size:12px;opacity:.85;line-height:1.5}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.course-card{background:#fff;border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow-soft);cursor:pointer}
.course-card .c-icon{font-size:28px;margin-bottom:6px}
.course-card .c-name{font-size:12px;font-weight:600}
.course-card .c-status{font-size:10px;color:var(--text-light);margin-top:3px}

/* Outfit */
.outfit-upload{width:100%;height:160px;border:2px dashed #f0d0d8;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-lighter);font-size:32px;cursor:pointer;overflow:hidden;background:var(--bg);margin-bottom:10px;position:relative}
.outfit-upload img{width:100%;height:100%;object-fit:cover}
.outfit-card{background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-soft)}
.outfit-card img{width:100%;height:150px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg)}
.outfit-card .ot-title{font-size:13px;font-weight:600}
.outfit-card .ot-desc{font-size:12px;color:var(--text-light);margin-top:3px}
.outfit-card .ot-link{font-size:11px;color:var(--primary-dark);margin-top:4px;cursor:pointer}
.sub-tab-row{display:flex;gap:6px;margin-bottom:12px;background:#fff;border-radius:var(--radius);padding:4px}
.sub-tab{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s}
.sub-tab.active{background:var(--primary);color:#fff;font-weight:500}

/* Travel */
.travel-fund{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);border-radius:var(--radius-lg);padding:20px;color:#fff;text-align:center;margin-bottom:14px}
.travel-fund .tf-label{font-size:12px;opacity:.9}
.travel-fund .tf-amount{font-size:32px;font-weight:700;margin:6px 0}
.travel-fund .tf-bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:8px}
.travel-fund .tf-bar .tf-fill{height:100%;background:#fff;border-radius:4px}
.travel-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft)}
.travel-card .tr-title{font-size:14px;font-weight:700;margin-bottom:4px}
.travel-card .tr-desc{font-size:12px;color:var(--text-light);line-height:1.6}
.travel-card .tr-budget{font-size:11px;color:var(--primary-dark);margin-top:6px}

/* Travel V2 */
.travel-stats{display:flex;gap:8px;margin-bottom:14px}
.travel-stat{flex:1;background:#fff;border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:var(--shadow-soft)}
.travel-stat .ts-num{font-size:26px;font-weight:700;color:var(--primary)}
.travel-stat .ts-icon{font-size:16px}
.travel-stat .ts-label{font-size:10px;color:var(--text-light);margin-top:2px}
.travel-stat:nth-child(2) .ts-num{color:var(--accent-dark)}
.travel-stat:nth-child(3) .ts-num{color:var(--success)}
.travel-tabs{display:flex;gap:6px;margin-bottom:14px;background:#fff;border-radius:var(--radius);padding:4px}
.travel-tab{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s}
.travel-tab.active{background:var(--primary);color:#fff;font-weight:500}
.travel-form{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow-soft)}
.travel-form .tf-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.travel-form .tf-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--text)}
.travel-form .tf-input:focus{border-color:var(--primary)}
.travel-form .tf-status{display:flex;gap:8px;margin:10px 0}
.travel-form .tf-status .chip{flex:1;text-align:center}
.travel-list-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-soft)}
.travel-list-item .tli-icon{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.travel-list-item .tli-body{flex:1;min-width:0}
.travel-list-item .tli-name{font-size:13px;font-weight:600}
.travel-list-item .tli-meta{font-size:11px;color:var(--text-light);margin-top:2px}
.travel-list-item .tli-note{font-size:11px;color:var(--text-lighter);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.travel-list-item .tli-actions{display:flex;gap:4px;margin-top:6px}
.travel-list-item .tli-actions .btn{padding:4px 10px;font-size:10px}
.travel-insp{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow-soft)}
.travel-insp .ti-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.travel-insp-card{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #faf0f3}
.travel-insp-card:last-child{border-bottom:none}
.travel-insp-card .tic-img{width:56px;height:56px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary-light) 0%,var(--accent-light) 100%);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.travel-insp-card .tic-body{flex:1;min-width:0}
.travel-insp-card .tic-name{font-size:13px;font-weight:600}
.travel-insp-card .tic-tags{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.travel-insp-card .tic-tags span{font-size:9px;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--text-light)}
.travel-insp-card .tic-desc{font-size:11px;color:var(--text-light)}
.travel-insp-card .tic-add{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}

/* Modal & Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,143,171,.95);color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}

/* Empty */
.empty{text-align:center;padding:30px 20px;color:var(--text-lighter)}
.empty .empty-icon{font-size:42px;margin-bottom:8px}
.empty .empty-text{font-size:13px}

/* Data bar */
.data-bar{display:flex;gap:8px;margin-top:12px}
.data-bar .btn{flex:1}

/* Responsive */
@media(min-width:768px){
  #app{max-width:900px}
  .side-nav{width:80px}
  .nav-item{width:62px}
  .comp-grid,.stat-grid{grid-template-columns:1fr 1fr 1fr}
  .course-grid,.word-game-grid{grid-template-columns:1fr 1fr 1fr}
}

/* Badges */
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.badge.yellow{background:var(--accent-light);color:var(--accent-dark)}
.badge.green{background:#E8F5E9;color:#2E7D32}

/* Body stat */
.body-stat{display:flex;gap:10px;margin-bottom:12px}
.bs-item{flex:1;background:var(--bg);border-radius:var(--radius-sm);padding:12px 8px;text-align:center}
.bs-label{font-size:10px;color:var(--text-light)}
.bs-value{font-size:16px;font-weight:700;color:var(--text);margin-top:2px}

/* Finance V2 - 粉黄果冻 */
.finance-tabs{position:fixed;bottom:0;left:var(--nav-w);right:0;max-width:560px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(255,107,157,.12);display:flex;z-index:50;padding:6px 0}
.finance-tab{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--text-light);cursor:pointer;position:relative;transition:all .2s}
.finance-tab:active{transform:scale(.92)}
.finance-tab.active{color:var(--primary-dark);font-weight:600}
.finance-tab.active::after{content:'';position:absolute;bottom:-6px;left:30%;right:30%;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px}
.finance-page{padding-bottom:70px}
.finance-sub-tabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:var(--radius);padding:4px;box-shadow:0 2px 8px rgba(255,107,157,.06)}
.finance-sub-tab{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s}
.finance-sub-tab:active{transform:scale(.95)}
.finance-sub-tab.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;font-weight:500;box-shadow:0 3px 10px rgba(255,107,157,.25)}
.finance-section-title{font-size:13px;font-weight:700;margin:18px 0 10px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.bill-summary{background:linear-gradient(135deg,var(--accent) 0%,#FFE082 50%,#FFC46B 100%);border-radius:var(--radius);padding:16px;color:#5D4037;margin-bottom:14px;box-shadow:0 4px 14px rgba(255,213,79,.2)}
.bill-summary .bs-row{display:flex;justify-content:space-between;margin-bottom:6px}
.bill-summary .bs-label{font-size:11px;opacity:.85}
.bill-summary .bs-num{font-size:22px;font-weight:700}
.bill-table{width:100%;border-collapse:collapse;font-size:12px}
.bill-table th{text-align:left;color:var(--text-light);font-weight:500;padding:8px 4px;border-bottom:1px solid var(--border)}
.bill-table td{padding:10px 4px;border-bottom:1px solid #f9eef1}
.bill-table .amt{font-weight:700;text-align:right}
.budget-card,.asset-card{background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(255,107,157,.06);border:1px solid rgba(255,107,157,.06)}
.budget-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.budget-name{font-size:14px;font-weight:600}
.budget-amt{font-size:12px;color:var(--text-light)}
.budget-bar{height:8px;background:rgba(255,107,157,.08);border-radius:4px;overflow:hidden}
.budget-bar .budget-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px}
.budget-status{font-size:11px;color:var(--text-light);margin-top:6px}
.asset-hero{background:linear-gradient(135deg,var(--accent) 0%,#FFE082 50%,#FFC46B 100%);border-radius:var(--radius-lg);padding:18px;color:#5D4037;margin-bottom:14px;box-shadow:0 4px 14px rgba(255,213,79,.2)}
.asset-hero .ah-row{display:flex;justify-content:space-between;align-items:center}
.asset-hero .ah-label{font-size:12px;opacity:.85}
.asset-hero .ah-num{font-size:28px;font-weight:700}
.account-list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.account-list-item:last-child{border-bottom:none}
.account-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--primary-light);color:var(--primary-dark);flex-shrink:0}
.account-info{flex:1}
.account-name{font-size:13px;font-weight:600}
.account-type{font-size:11px;color:var(--text-light)}
.account-amt{font-size:14px;font-weight:700}
.account-amt.debt{color:var(--danger)}
.account-amt.asset{color:var(--success)}
.account-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.account-type-item{background:#fff;border-radius:var(--radius);padding:14px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow-soft);border:2px solid transparent}
.account-type-item.active{border-color:var(--primary);background:var(--primary-light)}
.account-type-item .ati-icon{font-size:28px;margin-bottom:4px}
.account-type-item .ati-name{font-size:12px;font-weight:600}
.account-type-item .ati-desc{font-size:10px;color:var(--text-light);margin-top:2px}

/* Chart */
.chart-card{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 3px 10px rgba(255,107,157,.06);border:1px solid rgba(255,107,157,.05)}
.chart-line{display:flex;align-items:flex-end;justify-content:space-between;height:120px;padding:10px 0;gap:6px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar .bar{min-width:18px;width:80%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--primary) 0%,var(--accent) 100%);transition:height .3s}
.chart-bar .bar.income{background:linear-gradient(180deg,var(--success) 0%,#81C784 100%)}
.chart-bar .bar-label{font-size:9px;color:var(--text-light);white-space:nowrap}
.chart-bar .bar-val{font-size:9px;color:var(--text);font-weight:600}
.category-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f9eef1}
.category-row:last-child{border-bottom:none}
.category-dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.category-name{flex:1;font-size:13px}
.category-amt{font-size:13px;font-weight:700}
.category-pct{font-size:11px;color:var(--text-light);width:40px;text-align:right}

/* Record form - 果冻粉黄 */
.record-type-switch{display:flex;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:var(--radius);padding:4px;margin-bottom:14px;box-shadow:0 2px 8px rgba(255,107,157,.06)}
.record-type-switch .rts{flex:1;text-align:center;padding:10px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--text-light);cursor:pointer;transition:all .2s}
.record-type-switch .rts:active{transform:scale(.95)}
.record-type-switch .rts.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;box-shadow:0 3px 10px rgba(255,107,157,.25)}
.record-type-switch .rts.income.active{background:linear-gradient(135deg,#4ECDC4,#44C49B);color:#fff;box-shadow:0 3px 10px rgba(78,205,196,.25)}
.record-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.record-keypad .key{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-radius:14px;padding:16px 8px;text-align:center;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 3px 8px rgba(255,107,157,.08);border:1px solid rgba(255,107,157,.06);transition:all .12s;user-select:none}
.record-keypad .key:active{background:linear-gradient(135deg,var(--primary-light),#FFE082);transform:scale(.9);box-shadow:0 1px 4px rgba(255,107,157,.15)}
.record-keypad .key.zero{grid-column:span 2}
.record-keypad .key.del{background:linear-gradient(135deg,#FFE082,#FFD54F);color:#5D4037;font-size:14px}
.record-keypad .key.del:active{background:linear-gradient(135deg,#FFD54F,#FFC107)}
.record-amount{font-size:36px;font-weight:700;text-align:center;padding:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:var(--radius);margin-bottom:14px;color:var(--text);box-shadow:0 3px 10px rgba(255,107,157,.06)}
.record-amount.income{color:#4ECDC4}
.record-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.record-cat{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);box-shadow:0 2px 6px rgba(255,107,157,.06);cursor:pointer;font-size:12px;transition:all .15s;border:1px solid rgba(255,107,157,.05)}
.record-cat:active{transform:scale(.9)}
.record-cat.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;box-shadow:0 3px 10px rgba(255,107,157,.25);border-color:transparent}

function todayStr(){return dateStr(new Date())}
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return dateStr(d)}
function weekNum(s){const d=new Date(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));const yearStart=new Date(d.getFullYear(),0,1);return Math.ceil((((d-yearStart)/864e5)+1)/7)}
function fmtDate(s){const d=new Date(s);const w=['日','一','二','三','四','五','六'];return`${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`}
function monthStr(s){return s.slice(0,7)}
function monthWeek(s){const d=new Date(s);return Math.ceil(d.getDate()/7)}

const App={
  currentDate:todayStr(),
  currentPage:'home',
  langSub:'en',
  newsFilter:'all',
  aiFilter:'all',
  exerciseSub:'posture',
  dietMeal:'breakfast',
  financeSub:'detail',
  financeDetailSub:'bill',
  financeChartPeriod:'month',
  financeRecordType:'expense',
  financeRecordCat:'food',
  financeRecordAmount:'',
  financeRecordNote:'',
  dietMenuEdit:false,
  assetSub:'asset',
  init(){
    this.migrate();
    this.bindKeys();
    this.renderDate();
    this.switchModule('home');
    this.showSplash();
    if('serviceWorker'in navigator){
      navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
        reg.update();
        reg.addEventListener('updatefound',()=>{
          const newWorker=reg.installing;
          if(newWorker){
            newWorker.addEventListener('statechange',()=>{
              if(newWorker.state==='activated'&&navigator.serviceWorker.controller){
                toast('青梧笑已更新，刷新后生效');
              }
            });
          }
        });
      }).catch(()=>{})
    }
  },
  migrate(){
    // ensure defaults
    const d=this.dayData(this.currentDate);
    if(!d.todos) d.todos=JSON.parse(JSON.stringify(DEFAULT_TODOS));
    if(!d.quadrant) d.quadrant={q1:[],q2:[],q3:[],q4:[]};
    this.saveDay(this.currentDate,d);
  },
  dayData(s){return load('day_'+s,{todos:null,diet:{},finance:[],reflection:'',sleep:'',mood:'',weight:'',notes:'',newsNotes:'',wordStatus:{},quadrant:{q1:[],q2:[],q3:[],q4:[]},dietMenu:null})},
  saveDay(s,d){save('day_'+s,d)},
  changeDate(n){
    this.currentDate=addDays(this.currentDate,n);
    this.renderDate();
    this.renderAll();
  },
  goToday(){
    this.currentDate=todayStr();
    this.renderDate();
    this.renderAll();
  },
  renderDate(){$('dateText').textContent=fmtDate(this.currentDate)},
  calMonth:null,
  openCal(){
    const d=new Date(this.currentDate);
    this.calMonth={y:d.getFullYear(),m:d.getMonth()};
    this.renderCal();
    $('calOverlay').classList.add('show');
  },
  closeCal(e){
    if(e&&e.target!==e.currentTarget)return;
    $('calOverlay').classList.remove('show');
  },
  calPrev(){this.calMonth.m--;if(this.calMonth.m<0){this.calMonth.m=11;this.calMonth.y--;}this.renderCal();},
  calNext(){this.calMonth.m++;if(this.calMonth.m>11){this.calMonth.m=0;this.calMonth.y++;}this.renderCal();},
  calGoToday(){this.selectDate(todayStr());},
  renderCal(){
    const{y,m}=this.calMonth;
    $('calYm').textContent=`${y}年${m+1}月`;
    const first=new Date(y,m,1);
    let startDay=first.getDay();if(startDay===0)startDay=7;startDay--;
    const daysInMonth=new Date(y,m+1,0).getDate();
    const today=todayStr();
    let html='';
    for(let i=0;i<startDay;i++)html+='<div class="cal-cell other"></div>';
    for(let dd=1;dd<=daysInMonth;dd++){
      const ds=dateStr(new Date(y,m,dd));
      const cls=[(ds===today?'today':''),(ds===this.currentDate?'selected':'')].filter(Boolean).join(' ');
      const dot=this.hasDayData(ds)?'<div class="cal-dot"></div>':'';
      html+=`<div class="cal-cell ${cls}" onclick="App.selectDate('${ds}')">${dd}${dot}</div>`;
    }
    const total=startDay+daysInMonth;const tail=(7-total%7)%7;
    for(let i=0;i<tail;i++)html+='<div class="cal-cell other"></div>';
    $('calGrid').innerHTML=html;
  },
  hasDayData(s){
    const raw=localStorage.getItem('qwx5_day_'+s);
    if(!raw)return false;
    try{
      const d=JSON.parse(raw);
      if(!d)return false;
      if(d.todos&&(d.todos.work?.length||d.todos.personal?.length))return true;
      if(d.finance&&d.finance.length)return true;
      if(d.diet&&Object.values(d.diet).some(mm=>mm.name||mm.img))return true;
      if(d.quadrant&&(d.quadrant.q1?.length||d.quadrant.q2?.length||d.quadrant.q3?.length||d.quadrant.q4?.length))return true;
      if(d.wordStatus&&Object.keys(d.wordStatus).length)return true;
      if(d.sportDone&&d.sportDone.length)return true;
      if(d.postureDone)return true;
      if(d.reflection||d.improve||d.newsNotes)return true;
      return false;
    }catch(e){return false}
  },
  selectDate(s){
    this.currentDate=s;
    this.renderDate();
    this.switchModule('home');
    this.closeCal();
    toast('已切换到 '+fmtDate(s));
  },
  renderAll(){this.renderPage(this.currentPage)  },
  showSplash(){
    const splash=$('splash');if(!splash)return;
    const d=new Date();const w=['日','一','二','三','四','五','六'];
    $('splashDate').textContent=`${d.getMonth()+1}月${d.getDate()}日 · 周${w[d.getDay()]}`;
    $('splashQuote').textContent=this.getSplashQuote();
    splash.classList.remove('hidden');
  },
  hideSplash(){
    save('splash_date',todayStr());
    const splash=$('splash');if(splash)splash.classList.add('hidden');
    this.switchModule('home');
  },
  getSplashQuote(){
    const quotes=['好好吃饭，慢慢变好','今天也是发光的自己','小事做完，进步稳稳','你比昨天更棒了','坚持就是超能力','轻盈生活，温柔前行','每一步都算数','好体态从当下开始','温柔且有力量','做自己的光'];
    return quotes[new Date().getDate()%quotes.length];
  },
  switchModule(p){
    this.currentPage=p;
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
    document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+p));
    this.renderPage(p);
    $('content').scrollTop=0;
  },
  renderPage(p){
    const el=$('page-'+p);
    if(p==='home') el.innerHTML=this.renderHome();
    if(p==='plan') el.innerHTML=this.renderPlan();
    if(p==='diet') el.innerHTML=this.renderDiet();
    if(p==='finance') el.innerHTML=this.renderFinance();
    if(p==='language') el.innerHTML=this.renderLanguage();
    if(p==='exercise') el.innerHTML=this.renderExercise();
    if(p==='news') el.innerHTML=this.renderNews();
    if(p==='invest') el.innerHTML=this.renderInvest();
    if(p==='ai') el.innerHTML=this.renderAI();
    if(p==='outfit') el.innerHTML=this.renderOutfit();
    if(p==='travel') el.innerHTML=this.renderTravel();
  },

  /* ===== HOME ===== */
  renderHome(){
    const d=this.dayData(this.currentDate);
    const todos=[...(d.todos?.work||[]),...(d.todos?.personal||[])];
    const done=todos.filter(t=>t.done).length,total=todos.length||1;
    const pct=Math.round(done/total*100);

    const quote=QUOTES[new Date(this.currentDate).getDate()%QUOTES.length];
    const completed={plan:done===total&&total>0,diet:!!(d.diet&&d.diet.breakfast&&d.diet.lunch&&d.diet.dinner),finance:d.finance&&d.finance.length>0,language:this.getWordProgress()>=0.5,exercise:this.exerciseDone(),news:!!d.newsNotes,invest:!!load('goals',[]).length,news2:!!d.newsNotes};

      <div class="hero-row">

        </div>
        <div class="hero-progress">
          <svg width="70" height="70" viewBox="0 0 70 70"><circle class="ring-bg" cx="35" cy="35" r="28"></circle><circle class="ring-fg" cx="35" cy="35" r="28" stroke-dasharray="176" stroke-dashoffset="${176-pct/100*176}"></circle></svg>

        </div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card ${completed.plan?'done':''}"><div class="sc-icon">📋</div><div class="sc-num">${done}/${total}</div><div class="sc-label">今日待办</div></div>
      <div class="stat-card ${completed.exercise?'done':''}"><div class="sc-icon">💪</div><div class="sc-num">${this.getExerciseMin()}</div><div class="sc-label">运动分钟</div></div>
      <div class="stat-card ${completed.diet?'done':''}"><div class="sc-icon">🍽</div><div class="sc-num">${this.getMealCount()}</div><div class="sc-label">饮食记录</div></div>
      <div class="stat-card ${completed.finance?'done':''}"><div class="sc-icon">💰</div><div class="sc-num">¥${this.getTodaySpend()}</div><div class="sc-label">今日花费</div></div>
    </div>
    <div class="section-title"><span>TODAY · 今日完成情况</span><span class="count">还有 ${Object.values(completed).filter(v=>!v).length} 项</span></div>
    <div class="comp-grid">
      ${this.compCard('plan','📋','日常待办',completed.plan?'已完成':'待完成',completed.plan)}
      ${this.compCard('diet','🥗','饮食记录',completed.diet?'三餐已记':'等待记录',completed.diet)}
      ${this.compCard('exercise','🏃','健身运动',completed.exercise?'已完成':'待运动',completed.exercise)}
      ${this.compCard('finance','💳','今日记账',completed.finance?'已记账':'记一笔',completed.finance)}
      ${this.compCard('language','🌐','语言学习',this.getWordProgressText(),this.getWordProgress()>=0.5)}
      ${this.compCard('news','🌍','新闻随笔',completed.news?'已记录':'写思考',completed.news)}
      ${this.compCard('invest','📈','理财目标',completed.invest?'已设定':'设目标',completed.invest)}
      ${this.compCard('outfit','👗','穿搭灵感','查看推荐',false)}
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">✨</span>每日一句</div>
      <div class="quote-box" style="background:linear-gradient(135deg,var(--primary-light) 0%,var(--accent-light) 100%);border-radius:var(--radius);padding:14px;text-align:center">
        <div style="font-size:15px;font-weight:600;color:var(--primary-dark)">${quote}</div>
      </div>
    </div>`;
  },
  compCard(page,icon,name,status,done){
    return `<div class="comp-card ${done?'done':''}" onclick="App.switchModule('${page}')">
      <div class="cc-icon" style="background:${done?'#E8F5E9':''}">${icon}</div>
      <div class="cc-info"><div class="cc-name">${name}</div><div class="cc-status">${status}</div></div>
      <div class="cc-check">✓</div>

  /* ===== PLAN ===== */
  /* ===== PLAN ===== */
  renderPlan(){
    const d=this.dayData(this.currentDate);
    if(!d.todos) d.todos=JSON.parse(JSON.stringify(DEFAULT_TODOS));
    const work=d.todos.work||[], personal=d.todos.personal||[];
    const all=[...work.map(t=>({...t,cat:'work'})),...personal.map(t=>({...t,cat:'personal'}))];
    const done=all.filter(t=>t.done).length;
    const pct=Math.round(done/(all.length||1)*100);
    return `
    <div class="card plan-summary-card">
      <div class="plan-summary-top">
        <div>
          <div class="plan-summary-title">每日计划</div>
          <div class="plan-summary-sub">四象限法则</div>
        </div>
        <div class="plan-progress-box">
          <div class="ppb-label"><span>今天</span><span>完成 ${done}/${all.length}</span></div>
          <div class="ppb-bar"><div class="ppb-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
      <button class="plan-add-new" onclick="App.addPlanViaPrompt('q1')">+ 新计划</button>
    </div>
    <div class="card quadrant-wrap">
      <div class="quadrant-grid">
        ${this.qBox('q1','重要 · 紧急','马上做',all)}
        ${this.qBox('q2','重要 · 不紧急','安排做',all)}
        ${this.qBox('q3','紧急 · 不重要','简化做',all)}
        ${this.qBox('q4','不重要 · 不紧急','少做/不做',all)}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">💼</span>工作待办清单<div class="badge">${work.filter(t=>t.done).length}/${work.length}</div></div>
      ${work.map((t,i)=>this.todoRow(t,i,'work')).join('')}
      <div class="add-btn" onclick="App.addTodo('work')">+ 添加工作待办</div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">🌸</span>个人待办清单<div class="badge yellow">${personal.filter(t=>t.done).length}/${personal.length}</div></div>
      ${personal.map((t,i)=>this.todoRow(t,i,'personal')).join('')}
      <div class="add-btn" onclick="App.addTodo('personal')">+ 添加个人待办</div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">📝</span>晚间复盘</div>
      <div class="input-group"><label>完成事项 / 未完成原因</label><textarea class="textarea" id="planReflect" onblur="App.saveReflect(this.value)">${escapeHtml(d.reflection||'')}</textarea></div>
      <div class="input-group"><label>次日改进方案</label><textarea class="textarea" id="planImprove" onblur="App.saveImprove(this.value)">${escapeHtml(d.improve||'')}</textarea></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">📅</span>本周总结</div>
      <div class="stat-row" style="display:flex;gap:10px;margin-bottom:10px">
        <div class="stat-box" style="flex:1"><div class="num">${done}</div><div class="lbl">本周完成</div></div>
        <div class="stat-box yellow" style="flex:1"><div class="num">${all.length-done}</div><div class="lbl">未完成</div></div>
        <div class="stat-box green" style="flex:1"><div class="num">${pct}%</div><div class="lbl">完成率</div></div>
      </div>
      <button class="btn btn-primary btn-block btn-sm" onclick="App.weeklySummary()">查看本周详细汇总</button>
    </div>`;
  },
  qBox(q,main,sub,all){
    const d=this.dayData(this.currentDate);const qItems=d.quadrant?.[q]||[];
    const todoMap={'q1':'urgent','q2':'important','q3':'urgent','q4':'normal'};
    const todoItems=all.filter(t=>t.q===todoMap[q]&&!t.done).map(t=>t.text);
    const colors={'q1':'#FFF0F3','q2':'#FFF8E1','q3':'#E8F5E9','q4':'#F3E5F5'};
    const borders={'q1':'#ffcdd2','q2':'#ffe082','q3':'#c8e6c9','q4':'#e1bee7'};
    const items=[...todoItems,...qItems];
    return `<div class="quadrant" style="background:${colors[q]};border:1px solid ${borders[q]}">
      <div class="q-head">
        <div>
          <div class="q-title">${main}</div>
          <div class="q-sub">${sub}</div>
        </div>
        <div class="q-add-btn" onclick="App.addPlanViaPrompt('${q}')">+</div>
      </div>
      <div class="q-list">
        ${items.length?items.map((it,i)=>`<div class="q-edit-item"><span>· ${escapeHtml(it)}</span>${i>=todoItems.length?`<span class="q-del" onclick="App.delQuadrantItem('${q}',${i-todoItems.length})">×</span>`:''}</div>`).join(''):`<div class="q-empty">空空的~</div>`}
      </div>
    </div>`;
  },
  qItems(all,q){const items=all.filter(t=>t.q===q&&!t.done).map(t=>`· ${t.text}`).join('<br>');return items||'暂无'},
  todoRow(t,i,cat){
    return `<div class="todo-item ${t.done?'done':''}">
      <div class="todo-checkbox ${t.done?'checked':''}" onclick="App.toggleTodo('${cat}',${i})"></div>
      <div class="todo-content"><div class="todo-text">${escapeHtml(t.text)}<span class="todo-tag ${t.q}">${{urgent:'紧急',important:'重要',normal:'普通'}[t.q]}</span></div></div>
      <div class="todo-del" onclick="App.delTodo('${cat}',${i})">×</div>
    </div>`;
  },
  toggleTodo(cat,i){const d=this.dayData(this.currentDate);d.todos[cat][i].done=!d.todos[cat][i].done;this.saveDay(this.currentDate,d);this.renderPage('plan');this.updateHome();},
  delTodo(cat,i){const d=this.dayData(this.currentDate);d.todos[cat].splice(i,1);this.saveDay(this.currentDate,d);this.renderPage('plan');this.updateHome();},
  addTodo(cat){
    const text=prompt('输入待办事项：');if(!text)return;
    const d=this.dayData(this.currentDate);if(!d.todos)d.todos={work:[],personal:[]};
    d.todos[cat].push({text,done:false,q:cat==='work'?'important':'normal'});this.saveDay(this.currentDate,d);this.renderPage('plan');this.updateHome();
  },
  addPlanViaPrompt(q){
    const text=prompt('输入计划内容：');if(!text)return;
    const d=this.dayData(this.currentDate);if(!d.quadrant)d.quadrant={q1:[],q2:[],q3:[],q4:[]};
    d.quadrant[q].push(text);this.saveDay(this.currentDate,d);this.renderPage('plan');this.updateHome();
  },
  delQuadrantItem(q,i){
    const d=this.dayData(this.currentDate);d.quadrant[q].splice(i,1);this.saveDay(this.currentDate,d);this.renderPage('plan');
  },
  saveReflect(v){const d=this.dayData(this.currentDate);d.reflection=v;this.saveDay(this.currentDate,d)},
  saveImprove(v){const d=this.dayData(this.currentDate);d.improve=v;this.saveDay(this.currentDate,d)},
  weeklySummary(){
    let html='';for(let i=6;i>=0;i--){const s=addDays(this.currentDate,-i);const dd=this.dayData(s);const total=(dd.todos?.work?.length||0)+(dd.todos?.personal?.length||0);const done=(dd.todos?.work?.filter(t=>t.done).length||0)+(dd.todos?.personal?.filter(t=>t.done).length||0);html+=`<div style="padding:8px 0;border-bottom:1px solid #f5f0f0"><b>${fmtDate(s)}</b>：完成 ${done}/${total}</div>`;}
    this.openModal('本周待办汇总',html);
  },

  /* ===== DIET ===== */
  /* ===== DIET ===== */
  renderDiet(){
    const d=this.dayData(this.currentDate);if(!d.diet)d.diet={};
    const meals={breakfast:'早餐',lunch:'中餐',dinner:'晚餐'};

    </div>`;

  renderMenuDisplay(){

      <div style="font-size:11px;color:var(--text-lighter);margin-top:8px">一荤一素，成本控制在20元左右，简单易做</div>`;

  renderMenuEditor(){
    const menu=this.getDietMenu();
    return `<div>
      <div class="menu-edit-row"><span class="menu-label">早餐</span><input class="input" id="menu-b" value="${escapeHtml(menu.b)}"></div>
      <div class="menu-edit-row"><span class="menu-label">中餐</span><input class="input" id="menu-l" value="${escapeHtml(menu.l)}"></div>

  getDietMenu(){
    const d=this.dayData(this.currentDate);

    const idx=new Date(this.currentDate).getDate()%DIET_MENU.length;

  toggleDietMenuEdit(){this.dietMenuEdit=!this.dietMenuEdit;this.renderPage('diet')},
  saveDietMenu(){
    const d=this.dayData(this.currentDate);

  renderMealCard(meal,label){
    const d=this.dayData(this.currentDate);const m=d.diet[meal]||{};
    return `<div class="meal-card">
      <div class="meal-header"><div class="meal-name">${label}</div><div class="meal-cal">${m.cal||'--'} kcal</div></div>
      <div class="meal-upload" onclick="App.uploadMeal('${meal}')">${m.img?`<img src="${m.img}"><div class="del-img" onclick="event.stopPropagation();App.delMealImg('${meal}')">×</div>`:'+'}</div>
      <div class="input-group"><label>吃了什么</label><input class="input" value="${escapeHtml(m.name||'')}" onchange="App.saveMeal('${meal}','name',this.value)" placeholder="例如：燕麦+鸡蛋"></div>
      <div class="row">
        <div class="input-group"><label>热量(kcal)</label><input class="input" type="number" value="${m.cal||''}" onchange="App.saveMeal('${meal}','cal',this.value)" placeholder="0"></div>
        <div class="input-group"><label>花费(¥)</label><input class="input" type="number" value="${m.cost||''}" onchange="App.saveMeal('${meal}','cost',this.value)" placeholder="0"></div>
      </div>
    </div>`;
  },
  setDietMeal(k){this.dietMeal=k;this.renderPage('diet')},
  uploadMeal(meal){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();reader.onload=()=>{const d=this.dayData(this.currentDate);if(!d.diet)d.diet={};if(!d.diet[meal])d.diet[meal]={};d.diet[meal].img=reader.result;this.saveDay(this.currentDate,d);this.renderPage('diet');toast('图片已保存')};reader.readAsDataURL(file);
    };inp.click();
  },
  delMealImg(meal){const d=this.dayData(this.currentDate);delete d.diet[meal].img;this.saveDay(this.currentDate,d);this.renderPage('diet')},
  saveMeal(meal,field,val){const d=this.dayData(this.currentDate);if(!d.diet)d.diet={};if(!d.diet[meal])d.diet[meal]={};d.diet[meal][field]=val;this.saveDay(this.currentDate,d);this.updateHome();},
  dietAnalysis(){
    const days=[];for(let i=6;i>=0;i--)days.push(this.dayData(addDays(this.currentDate,-i)));
    const hasProtein=days.some(d=>Object.values(d.diet||{}).some(m=>(m.name||'').match(/鸡|鱼|牛|虾|蛋|肉/)));
    const hasVeg=days.some(d=>Object.values(d.diet||{}).some(m=>(m.name||'').match(/菜|瓜|茄|菇|豆|笋|菠/)));
    const hasFruit=days.some(d=>Object.values(d.diet||{}).some(m=>(m.name||'').match(/果|苹|橙|莓|蕉/)));
    let tips=[];if(!hasProtein)tips.push('本周蛋白质摄入不足，建议每天安排鸡蛋/鸡胸肉/鱼虾');if(!hasVeg)tips.push('蔬菜摄入偏少，晚餐多加一份绿叶菜');if(!hasFruit)tips.push('水果摄入不足，下午可加一个苹果或橙子');
    return tips.length?tips.join('；'):'本周饮食较均衡，继续保持 ✓';
  },

  renderFinanceBill(){
    const period=this.financeBillPeriod||'month';
    const isYear=period==='year';
    const items=isYear?this.yearItems(this.currentDate.slice(0,4)):this.monthItems(monthStr(this.currentDate));
    const income=items.filter(i=>i.type==='income').reduce((a,b)=>a+(+b.amount||0),0);
    const expense=items.filter(i=>i.type!=='income').reduce((a,b)=>a+(+b.amount||0),0);
    const rows=isYear?this.yearBillRows(this.currentDate.slice(0,4)):this.monthBillRows(monthStr(this.currentDate));
    return `
    <div class="finance-section-title"><span>账单</span>
      <div class="chips" style="margin:0">
        <div class="chip ${period==='month'?'active':''}" onclick="App.setFinanceBillPeriod('month')">月账单</div>
        <div class="chip ${period==='year'?'active':''}" onclick="App.setFinanceBillPeriod('year')">年账单</div>
      </div>
    </div>
    <div class="bill-summary">
      <div class="bs-row"><div><div class="bs-label">${isYear?'年结余':'月结余'}</div><div class="bs-num">¥${(income-expense).toFixed(2)}</div></div></div>
      <div class="bs-row"><div><div class="bs-label">${isYear?'年收入':'月收入'}</div><div class="bs-num">¥${income.toFixed(2)}</div></div><div style="text-align:right"><div class="bs-label">${isYear?'年支出':'月支出'}</div><div class="bs-num">¥${expense.toFixed(2)}</div></div></div>
    </div>
    <div class="card">
      <table class="bill-table"><thead><tr><th>${isYear?'月份':'日期'}</th><th>收入</th><th>支出</th><th>结余</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${r.label}</td><td class="amt" style="color:var(--success)">¥${r.income.toFixed(2)}</td><td class="amt" style="color:var(--danger)">¥${r.expense.toFixed(2)}</td><td class="amt">¥${(r.income-r.expense).toFixed(2)}</td></tr>`).join('')}
      </tbody></table>
      ${!rows.length?'<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">暂无账单数据</div></div>':''}
    </div>`;
  },
  setFinanceBillPeriod(p){haptic(12);this.financeBillPeriod=p;this.renderPage('finance');},
  monthBillRows(month){
    const out=[];
    for(let i=0;i<31;i++){
      const s=addDays(month+'-01',i);if(s.slice(0,7)!==month)break;
      const items=this.dayData(s).finance||[];
      const income=items.filter(it=>it.type==='income').reduce((a,b)=>a+(+b.amount||0),0);
      const expense=items.filter(it=>it.type!=='income').reduce((a,b)=>a+(+b.amount||0),0);
      if(income||expense) out.push({label:`${s.slice(5)}`,income,expense});
    }
    return out;
  },
  yearBillRows(year){
    const out=[];for(let m=1;m<=12;m++){const ms=`${year}-${String(m).padStart(2,'0')}`;const items=this.monthItems(ms);const income=items.filter(it=>it.type==='income').reduce((a,b)=>a+(+b.amount||0),0);const expense=items.filter(it=>it.type!=='income').reduce((a,b)=>a+(+b.amount||0),0);if(income||expense) out.push({label:`${m}月`,income,expense});}return out;
  },

  renderFinanceBudget(){

    const key=period==='month'?monthStr(this.currentDate):this.currentDate.slice(0,4);

      <div class="chips" style="margin:0">

  },
  setFinanceBudgetPeriod(p){haptic(12);this.financeBudgetPeriod=p;this.renderPage('finance');},
  budgetCard(b,i,period,key){
    const spent=this.budgetSpent(b.cat,period,key);
    const pct=Math.min(100,Math.round(spent/b.target*100))||0;
    return `<div class="budget-card">
      <div class="budget-top"><div class="budget-name">${FINANCE_CATS.expense.find(c=>c.k===b.cat)?.i||'🧩'} ${b.name}</div><div class="budget-amt">¥${spent.toFixed(2)} / ¥${(+b.target).toFixed(2)}</div></div>
      <div class="budget-bar"><div class="budget-fill" style="width:${pct}%"></div></div>
      <div class="budget-status">已用 ${pct}% · ${spent>b.target?'超支 ¥'+(spent-b.target).toFixed(2):'剩余 ¥'+(b.target-spent).toFixed(2)}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-ghost btn-sm" onclick="App.editBudget(${i})">编辑</button>

      </div>
    </div>`;
  },
  budgetSpent(cat,period,key){
    const items=period==='month'?this.monthItems(key):this.yearItems(key);
    return items.filter(it=>it.type!=='income'&&it.cat===cat).reduce((a,b)=>a+(+b.amount||0),0);
  },
  addBudget(){
    const cats=FINANCE_CATS.expense.map(c=>`<option value="${c.k}">${c.i} ${c.n}</option>`).join('');
    this.openModal('添加预算',`

  saveBudget(){

  delBudget(idx){
    const budgets=load('budgets',[]);const period=this.financeBudgetPeriod||'month';const key=period==='month'?monthStr(this.currentDate):this.currentDate.slice(0,4);
    const list=budgets.filter(b=>b.period===period&&b.periodKey===key);
    const target=list[idx];save('budgets',budgets.filter(b=>b.id!==target.id));this.renderPage('finance');
  },
  editBudget(idx){
    const budgets=load('budgets',[]);const period=this.financeBudgetPeriod||'month';const key=period==='month'?monthStr(this.currentDate):this.currentDate.slice(0,4);
    const list=budgets.filter(b=>b.period===period&&b.periodKey===key);const b=list[idx];
    const cats=FINANCE_CATS.expense.map(c=>`<option value="${c.k}" ${c.k===b.cat?'selected':''}>${c.i} ${c.n}</option>`).join('');

      <div class="input-group"><label>预算名称</label><input class="input" id="bdName" value="${escapeHtml(b.name)}"></div>

      <div class="input-group"><label>预算金额</label><input class="input" type="number" id="bdTarget" value="${b.target}"></div>

  updateBudget(id){

  renderFinanceChart(){

      <div class="chips" style="margin:0">

  setFinanceChartPeriod(p){haptic(12);this.financeChartPeriod=p;this.renderPage('finance');},

  uploadBillRecord(){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      const status=$('ocrStatus');if(status)status.style.display='block';
      toast('正在识别图片，请稍候...');
      const reader=new FileReader();
      reader.onload=async()=>{
        const dataUrl=reader.result;
        try{
          const result=await Tesseract.recognize(dataUrl,'chi_sim+eng',{logger:m=>{if(m.status==='recognizing text'){const pct=Math.round(m.progress*100);if(status)status.textContent=`🔍 识别中 ${pct}%`;}}});
          const text=result.data.text;
          const parsed=this.parseBillText(text);
          if(parsed.amount){
            this.financeRecordType=parsed.type==='income'?'income':'expense';
            this.financeRecordCat=parsed.cat||'other';
            this.financeRecordAmount=String(parsed.amount);
            this.financeRecordNote=parsed.note||'截图自动识别';
            toast(`已识别：${this.financeRecordType==='income'?'收入':'支出'} ¥${parsed.amount}`);
          }else{
            toast('未识别到金额，请手动输入');
          }
        }catch(err){console.error(err);toast('识别失败，请手动输入');}
        if(status){status.style.display='none';status.textContent='🔍 正在识别截图...';}
        this.renderPage('finance');
      };
      reader.readAsDataURL(file);
    };
    inp.click();
  },
  monthItems(month){const out=[];for(let i=0;i<31;i++){const s=addDays(month+'-01',i);if(s.slice(0,7)!==month)break;const items=this.dayData(s).finance||[];out.push(...items.map(it=>({...it,date:s})));}return out;},
  yearItems(year){const out=[];for(let m=1;m<=12;m++){out.push(...this.monthItems(`${year}-${String(m).padStart(2,'0')}`));}return out;},
  parseBillText(text){
    const lines=text.split('\n');
    let amount='', type='expense', cat='other', note='';
    const amtRe=/[+-]?[¥￥]\s*(\d{1,5}(?:\.\d{1,2})?)|(\d{1,5}(?:\.\d{1,2})?)\s*[元￥¥]|[-](\d{1,5}(?:\.\d{1,2})?)/g;
    const amounts=[];let m;
    while((m=amtRe.exec(text))!==null){amounts.push(parseFloat(m[1]||m[2]||m[3]));}
    if(amounts.length) amount=Math.max(...amounts).toFixed(2);
    if(/[+\-]?\s*[¥￥]?\s*\d/.test(text)&&(/收入|收款|退款|工资|奖金/.test(text)||/[+¥￥]\s*\d/.test(text))) type='income';
    const t=text.toLowerCase();
    if(/午餐|晚餐|早餐|外卖|食堂|餐厅|麦当劳|肯德基|星巴克|咖啡|奶茶|美食|饭|面|粉|饺子/.test(t)) cat='food';
    else if(/地铁|公交|滴滴|打车|出租车|火车|机票|加油|停车|通勤/.test(t)) cat='transport';
    else if(/淘宝|京东|天猫|拼多多|商场|超市|便利店|优衣库|衣服|鞋|包|化妆品/.test(t)) cat='shopping';
    else if(/电影|游戏|会员|视频|音乐|娱乐|ktv|剧本杀|密室/.test(t)) cat='entertain';
    else if(/房租|水电|物业|房租|房贷/.test(t)) cat='housing';
    else if(/药|医院|诊所|体检/.test(t)) cat='medical';
    for(const line of lines){if(line.trim()&&line.length>2&&line.length<20&&!/[\d¥.\-]+/.test(line)&&!/微信支付|支付宝|账单|明细|金额|时间|状态|商户/.test(line)){note=line.trim().slice(0,15);break;}}
    return {amount,type,cat,note};
  },

      return `<div class="card"><div class="card-title"><span class="icon">📝</span>生词本 · ${wrong.length}个</div>${wrong.length?wrong.map((w,i)=>`<div style="padding:10px 0;border-bottom:1px solid #f5f0f0;display:flex;justify-content:space-between;align-items:center"><div><b>${w.w}</b> <span style="color:var(--text-light);font-size:12px">${w.p}</span><div style="font-size:12px;color:var(--text-light)">${w.m}</div></div><div style="font-size:20px;cursor:pointer" onclick="speak('${w.w}','${w.lang||'en-US'}')">🔊</div></div>`).join(''):'<div class="empty">暂无生词</div>'}<button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px" onclick="App.setLang('${this.langPrevLang||'en'}')">返回单词</button></div>`;
    }
    if(this.langSub==='review'){
      const recent=this.getRecentWords(7);
      return `<div class="card"><div class="card-title"><span class="icon">🔄</span>复习 · 近7天单词</div>${recent.length?recent.map((w,i)=>`<div class="word-card" style="margin-bottom:10px" id="rev-${i}" onclick="App.toggleExample(${i},'rev-${i}','rev-ex-${i}')">
        <div class="w-word">${w.w} <span style="font-size:16px;cursor:pointer" onclick="event.stopPropagation();speak('${w.w}','${w.lang||'en-US'}')">🔊</span></div>
        <div class="w-phonetic">${w.p}</div>
        <div class="w-meaning">${w.m}</div>
        <div class="word-example" id="rev-ex-${i}"><div class="ex-line">${w.ex}</div><div class="ex-cn">${w.cn}</div></div>
      </div>`).join(''):'<div class="empty">暂无复习内容</div>'}<button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px" onclick="App.setLang('${this.langPrevLang||'en'}')">返回单词</button></div>`;
    }
  },
  getRecentWords(days){
    const out=[];const seen=new Set();
    for(let i=0;i<days;i++){
      const s=addDays(this.currentDate,-i);
      const d=this.dayData(s);if(!d.wordStatus)continue;
      Object.entries(d.wordStatus).forEach(([key,st])=>{
        if(st!=='known')return;
        const [lang,date,idx]=key.split('_');
        const words=lang==='en'?EN_WORDS:RU_WORDS;
        const w=this.getDailyWords(words,Math.min(words.length,15+(monthWeek(s)-1)*2))[idx];
        if(w&&!seen.has(w.w)){seen.add(w.w);out.push({...w,lang});}
      });
    }
    return out;
  },
  wordCard(w,i,key){
    const st=this.dayData(this.currentDate).wordStatus?.[key]||'pending';
    return `<div class="word-card" id="wc-${i}" onclick="App.toggleExample(${i},'wc-${i}','we-${i}')">
      <div class="w-word">${w.w} <span style="font-size:16px;cursor:pointer" onclick="event.stopPropagation();speak('${w.w}','${w.lang||'en-US'}')">🔊</span></div>
      <div class="w-phonetic">${w.p}</div>
      <div class="w-meaning">${w.m} <span class="w-status ${st}">${{pending:'待学习',known:'已掌握',unknown:'生词'}[st]}</span></div>
      <div class="word-example" id="we-${i}">
        <div class="ex-line">${w.ex}</div>
        <div class="ex-cn">${w.cn}</div>
      </div>
      <div class="w-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="App.markWord('${key}',${i},'known')">✓ 认识</button>
        <button class="btn btn-outline btn-sm" onclick="App.markWord('${key}',${i},'unknown')">✗ 不认识</button>
      </div>
    </div>`;
  },
  setLang(l){
    if(['en','ru'].includes(l)) this.langPrevLang=l;
    this.langSub=l;this.renderPage('language');
  },
  toggleExample(i,cardId,exId){$(exId).classList.toggle('show');},
  markWord(key,i,status){
    const d=this.dayData(this.currentDate);if(!d.wordStatus)d.wordStatus={};d.wordStatus[key]=status;this.saveDay(this.currentDate,d);
    if(status==='unknown'){const wrong=load('wrongWords',[]);const [lang,date,idx]=key.split('_');const words=lang==='en'?EN_WORDS:RU_WORDS;const w=this.getDailyWords(words,Math.min(words.length,15+(monthWeek(this.currentDate)-1)*2))[idx];if(w&&!wrong.find(x=>x.w===w.w&&x.lang===lang))wrong.push({...w,lang});save('wrongWords',wrong);}
    this.renderPage('language');this.updateHome();
  },
  savePractice(){save('pracTrans_'+this.currentDate,$('pracTrans').value);save('pracDialog_'+this.currentDate,$('pracDialog').value);toast('练习已保存');},
  getDailySentences(lang){
    const all=ORAL_PRACTICE[lang]||[];
    const d=new Date(this.currentDate);const start=new Date(d.getFullYear(),0,1);const dayOfYear=Math.floor((d-start)/864e5);
    const out=[];for(let i=0;i<3;i++){out.push(all[(dayOfYear*3+i)%all.length]);}return out;
  },
  getPracticeIndex(lang){return load('pracIdx_'+this.currentDate+'_'+lang,0);},
  setPracticeIndex(lang,idx){save('pracIdx_'+this.currentDate+'_'+lang,idx);},
  getPracticeProgress(lang){
    const sentences=this.getDailySentences(lang);
    const def=sentences.map(()=>'');
    return load('pracProgress_'+this.currentDate+'_'+lang,def);
  },
  setPracticeProgress(lang,idx,status){
    const p=this.getPracticeProgress(lang);p[idx]=status;save('pracProgress_'+this.currentDate+'_'+lang,p);
  },
  currentPracticeSentence(){const lang=this.langPrevLang||'en';return this.getDailySentences(lang)[this.getPracticeIndex(lang)];},
  speakPracticeSentence(){const s=this.currentPracticeSentence();if(s)speak(s.s,(this.langPrevLang||'en')==='en'?'en-US':'ru-RU');},
  togglePracticeMeaning(){
    const lang=this.langPrevLang||'en';const key='pracMeaningVisible_'+this.currentDate+'_'+lang;
    const v=!load(key,false);save(key,v);this.renderPage('language');
  },
  startDictation(){
    const s=this.currentPracticeSentence();if(!s)return;
    const area=$('dictationArea');const sentence=$('dictationSentence');const input=$('dictInput');
    if(!area)return;
    area.style.display='block';
    const regex=new RegExp('('+s.kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    sentence.innerHTML=s.s.replace(regex,'<span style="display:inline-block;min-width:60px;border-bottom:2px dashed var(--primary);padding:0 4px">&nbsp;</span>');
    input.value='';input.focus();
  },
  checkDictation(){
    const s=this.currentPracticeSentence();if(!s)return;
    const v=$('dictInput').value.trim().toLowerCase();
    const correct=s.kw.toLowerCase();
    if(v===correct){
      this.setPracticeProgress(this.langPrevLang||'en',this.getPracticeIndex(this.langPrevLang||'en'),'dictation');
      toast('✓ 默写正确');
      this.renderPage('language');
    }else{toast('✗ 正确答案是：'+s.kw);}
  },
  markReadDone(){
    const lang=this.langPrevLang||'en';const idx=this.getPracticeIndex(lang);
    this.setPracticeProgress(lang,idx,'read');toast('🎤 跟读完成');this.renderPage('language');
  },
  prevPractice(){
    const lang=this.langPrevLang||'en';const idx=this.getPracticeIndex(lang);
    if(idx>0){this.setPracticeIndex(lang,idx-1);this.renderPage('language');}
  },
  nextPractice(){
    const lang=this.langPrevLang||'en';const idx=this.getPracticeIndex(lang);
    const total=this.getDailySentences(lang).length;
    if(idx<total-1){this.setPracticeIndex(lang,idx+1);this.renderPage('language');}
  },
  langGame(type){
    if(type==='listen'){const words=this.langSub==='en'||!['en','ru'].includes(this.langSub)?EN_WORDS:RU_WORDS;const w=words[Math.floor(Math.random()*words.length)];this.openModal('听音识词',`<div style="text-align:center;padding:20px"><div style="font-size:42px;margin-bottom:10px">👂</div><div style="font-size:14px;color:var(--text-light)">点击播放，选择正确单词</div><button class="btn btn-primary btn-block" style="margin:14px 0" onclick="speak('${w.w}','${w.lang||'en-US'}')">▶ 播放</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${this.shuffle(words).slice(0,4).map(x=>`<button class="btn btn-outline btn-sm" onclick="App.checkGame('${x.w}','${w.w}')">${x.w}</button>`).join('')}</div></div>`);}
    if(type==='sentence'){const lang=this.langSub==='en'||!['en','ru'].includes(this.langSub)?'en':'ru';const s=ORAL_PRACTICE[lang][Math.floor(Math.random()*ORAL_PRACTICE[lang].length)];this.openModal('句子跟读',`<div style="text-align:center;padding:16px"><div style="font-size:16px;font-weight:600;color:var(--primary-dark);margin-bottom:8px">${s.s}</div><div style="font-size:13px;color:var(--text-light);margin-bottom:14px">${s.m}</div><button class="btn btn-primary btn-block" onclick="speak('${s.s.replace(/'/g,"\\'")}','${lang==='en'?'en-US':'ru-RU'}')">🔊 听一听</button><button class="btn btn-yellow btn-block" style="margin-top:8px" onclick="App.closeModal()">跟读完成</button></div>`);}
    if(type==='flash'||type==='spell')toast('该模式持续开发中，先用单词卡片学习吧');
  },
  shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;},
  checkGame(ans,correct){if(ans===correct){toast('✓ 正确');this.closeModal();}else{toast('✗ 再听一次');}},

        <div class="course-card" onclick="toast('课程待展开')"><div class="c-icon">📄</div><div class="c-name">办公效率</div><div class="c-status">未开始</div></div>
        <div class="course-card" onclick="toast('课程待展开')"><div class="c-icon">🌐</div><div class="c-name">多语种翻译</div><div class="c-status">未开始</div></div>

  /* ===== OUTFIT ===== */

        身高167cm / 体重115斤 / 21岁 · 点击博主名调起 App，若打不开可点 📋 复制名字到对应平台搜索
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">

            <span style="font-size:10px;color:var(--text-lighter);cursor:pointer" onclick="App.copyBloggerName('${o.kw.replace(/'/g,"\\'")}')">📋 复制搜索词</span>

    <div class="card">

        <div class="outfit-card" style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <div style="font-size:24px">${s.emoji}</div>
          <div style="flex:1;min-width:0">
            <div class="ot-title">${s.name}</div>
            <div class="ot-desc">${s.desc}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:11px;color:var(--primary);font-weight:600">¥${s.price}</div>
            <div style="font-size:10px;color:var(--text-lighter)">去逛逛 →</div>
          </div>
        </div>
