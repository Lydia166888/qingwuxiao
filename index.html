<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="青梧笑">
<meta name="theme-color" content="#FF6B9D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<title>青梧笑</title>
<style>
:root{
--primary:#FF6B9D;--primary-dark:#E63976;--primary-light:#FFE4EC;--primary-lighter:#FFF0F5;
--accent:#FFD93D;--accent-light:#FFF9E0;--accent-dark:#F9A825;
--bg:#FFF5F7;--bg2:#FFF0E8;--card:#fff;--text:#4A3F3F;--text-light:#8D7E7E;--text-lighter:#B8A8A8;
--border:#FCE4EC;--success:#66BB6A;--warning:#FFA726;--danger:#EF5350;
--shadow:0 4px 16px rgba(255,107,157,.12);--shadow-soft:0 2px 8px rgba(255,107,157,.08);
--radius:20px;--radius-sm:12px;--radius-lg:28px;--nav-w:72px;--header-h:56px;
--jelly:rgba(255,255,255,.72);--jelly-bd:rgba(255,107,157,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
input,textarea,button,select{font-family:inherit;font-size:inherit;border:none;outline:none}
a{color:var(--primary-dark);text-decoration:none}
ul{list-style:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:row;position:relative;background:var(--bg)}
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}

/* Splash - 粉黄果冻·无卡片全屏高级版 */
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#FF8FB1 0%,#FFB8A0 42%,#FFD93D 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:32px 28px;transition:opacity .6s,visibility .6s;overflow:hidden}
.splash::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.2),transparent 60%),radial-gradient(100% 60% at 50% 100%,rgba(255,107,157,.1),transparent 70%);pointer-events:none}
.splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash .petal{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);pointer-events:none;filter:blur(.5px);animation:petalFloat linear infinite}
@keyframes petalFloat{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.4}85%{opacity:.25}100%{transform:translateY(-140px) rotate(360deg);opacity:0}}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:360px;width:100%;animation:cardIn .7s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash-date{font-size:14px;font-weight:600;letter-spacing:3px;opacity:.94;margin-bottom:12px;text-shadow:0 1px 4px rgba(180,60,90,.15)}
.splash-weather{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:30px;background:rgba(255,255,255,.28);padding:8px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.42);cursor:pointer}
.splash-weather-link{cursor:pointer}
.splash-greeting{font-size:32px;font-weight:700;letter-spacing:2px;margin-bottom:10px;text-shadow:0 2px 8px rgba(180,60,90,.18)}
.splash-quote{font-size:16px;font-weight:500;line-height:1.7;max-width:300px;margin-bottom:26px;opacity:.97;text-shadow:0 1px 4px rgba(180,60,90,.12)}
.splash-almanac{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin-bottom:34px}
.splash-almanac .sa-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.36);border-radius:14px;padding:10px 14px}
.splash-almanac .sa-label{font-size:14px;font-weight:700;min-width:30px;text-align:center;padding:3px 0;border-radius:8px;letter-spacing:1px}
.splash-almanac .sa-yi-label{background:rgba(255,217,61,.95);color:#5A3E00}
.splash-almanac .sa-ji-label{background:rgba(255,107,157,.9);color:#fff}
.splash-almanac .sa-item-half{flex:1;font-size:14px;font-weight:600;color:#fff;text-align:left;letter-spacing:.5px;line-height:1.4;text-shadow:0 1px 3px rgba(120,40,60,.2)}
.splash-btn{position:relative;z-index:2;background:#fff;color:var(--primary-dark);border:none;border-radius:30px;padding:15px 56px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 28px rgba(255,107,157,.25);letter-spacing:2px;transition:transform .2s}
.splash-btn:active{transform:scale(.96)}
.splash-hint{position:relative;z-index:2;font-size:12px;opacity:.78;margin-top:10px;letter-spacing:1px}

/* Side Nav */
.side-nav{width:var(--nav-w);background:var(--jelly);backdrop-filter:blur(16px);border-right:1px solid var(--jelly-bd);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:14px 0 8px;z-index:20;overflow-y:auto}
.side-nav::-webkit-scrollbar{width:0}
.nav-logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 4px 12px rgba(255,107,157,.3);flex-shrink:0}
.nav-item{width:54px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-light);cursor:pointer;transition:all .2s;position:relative;border-radius:14px;margin-bottom:5px;flex-shrink:0}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active{color:var(--primary-dark);background:var(--primary-light)}
.nav-item:active{transform:scale(.92)}
.nav-fav{margin-top:auto;width:54px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent-dark);cursor:pointer;border-radius:14px;flex-shrink:0}
.nav-fav:active{transform:scale(.92)}
.nav-fav .nav-icon{font-size:18px}
.nav-fav .nav-label{font-size:9px}

/* Header */
.header{height:var(--header-h);background:var(--jelly);backdrop-filter:blur(12px);border-bottom:1px solid var(--jelly-bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:relative;z-index:10}
.header .title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.header .title::before{content:'✿';color:var(--primary);font-size:16px}
.header .date-bar{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--primary-lighter);border-radius:20px;padding:4px 8px}
.header .date-bar .arrow{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--primary);cursor:pointer;font-size:16px;box-shadow:var(--shadow-soft)}
.header .date-bar .arrow:active{background:var(--primary-light)}
.header .date-bar .date-text{min-width:90px;text-align:center;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px}
.header .date-bar .date-text::after{content:'▾';font-size:9px;color:var(--primary);opacity:.6}
.header .today-btn{font-size:11px;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:12px;cursor:pointer}

/* Calendar */
.cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:250;display:none;align-items:flex-start;justify-content:center;padding-top:56px}
.cal-overlay.show{display:flex;animation:calFade .18s}
@keyframes calFade{from{opacity:0}to{opacity:1}}
.cal-box{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.15);width:330px;max-width:92vw;padding:18px;animation:calSlide .22s}
@keyframes calSlide{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .cal-ym{font-size:16px;font-weight:700;color:var(--text)}
.cal-head .cal-nav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--primary);cursor:pointer;font-size:17px}
.cal-head .cal-nav:active{background:var(--primary-light)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-light);margin-bottom:6px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;font-size:13px;color:var(--text);cursor:pointer;position:relative;transition:background .15s}
.cal-cell:active{background:var(--primary-light)}
.cal-cell.other{color:var(--text-light);opacity:.35}
.cal-cell.today{color:var(--primary);font-weight:700}
.cal-cell.today::before{content:'';position:absolute;inset:3px;border:1.5px solid var(--primary);border-radius:9px}
.cal-cell.selected{background:var(--primary);color:#fff;font-weight:700}
.cal-cell.selected::before{display:none}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-cell.selected .cal-dot{background:#fff}
.cal-foot{display:flex;gap:8px;margin-top:16px}
.cal-foot .btn{flex:1}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
.content::-webkit-scrollbar{width:0}
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--jelly);backdrop-filter:blur(10px);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title .icon{font-size:18px}
.card-title .more{font-size:12px;color:var(--text-lighter);margin-left:auto;cursor:pointer}

/* Hero */
.hero-card{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:22px 18px;color:#fff;box-shadow:0 8px 24px rgba(255,107,157,.2);margin-bottom:14px;position:relative;overflow:hidden}
.hero-card::before{content:'✿';position:absolute;right:14px;top:14px;font-size:60px;opacity:.12}
.hero-date{font-size:12px;opacity:.9;margin-bottom:6px}
.hero-greeting{font-size:22px;font-weight:700;margin-bottom:6px}
.hero-quote{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:14px}
.hero-row{display:flex;align-items:center;justify-content:space-between}
.hero-progress{position:relative;width:70px;height:70px}
.hero-progress svg{transform:rotate(-90deg)}
.hero-progress .ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:7}
.hero-progress .ring-fg{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.hero-progress .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700}
.hero-info{flex:1;padding-right:12px}
.hero-info .done-text{font-size:13px;opacity:.9}
.hero-info .streak{font-size:12px;opacity:.8;margin-top:4px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.stat-card .sc-icon{font-size:26px;margin-bottom:4px}
.stat-card .sc-num{font-size:22px;font-weight:700;color:var(--text)}
.stat-card .sc-label{font-size:11px;color:var(--text-light);margin-top:2px}
.stat-card.done .sc-num{color:var(--success)}
.stat-card.warn .sc-num{color:var(--accent-dark)}

/* Section title */
.section-title{font-size:13px;font-weight:700;color:var(--text-light);margin:18px 0 10px;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.section-title .count{font-size:11px;color:var(--text-lighter);font-weight:500}

/* Completion grid */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comp-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.comp-card:active{transform:scale(.97)}
.comp-card .cc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-light)}
.comp-card .cc-info{flex:1;min-width:0}
.comp-card .cc-name{font-size:13px;font-weight:600}
.comp-card .cc-status{font-size:11px;color:var(--text-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card .cc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:12px}
.comp-card.done .cc-check{background:var(--success);border-color:var(--success);color:#fff}

/* Inputs */
.input,.textarea,.select{width:100%;background:var(--primary-lighter);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text);transition:border .2s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary)}
.textarea{resize:vertical;min-height:70px;line-height:1.6}
.input-group{margin-bottom:10px}
.input-group label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;box-shadow:0 3px 10px rgba(255,107,157,.2)}
.btn-primary:active{transform:scale(.96)}
.btn-yellow{background:linear-gradient(135deg,var(--accent),#FFE082);color:#5D4037;box-shadow:0 3px 10px rgba(255,213,79,.2)}
.btn-yellow:active{transform:scale(.96)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary-dark)}
.btn-outline:active{background:var(--primary-light)}
.btn-ghost{background:var(--primary-light);color:var(--primary-dark)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%}
.btn:active{transform:scale(.96)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--primary-lighter);color:var(--text-light);cursor:pointer;border:1px solid transparent;transition:all .2s}
.chip.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;border-color:transparent}
.chip.yellow-active{background:var(--accent);color:#5D4037}

/* Sub tabs */
.sub-tab-row{display:flex;gap:6px;margin-bottom:12px;background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:4px;border:1px solid var(--jelly-bd)}
.sub-tab{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s}
.sub-tab:active{transform:scale(.94)}
.sub-tab.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;font-weight:500;box-shadow:0 3px 8px rgba(255,107,157,.2)}

/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.todo-item:last-child{border-bottom:none}
.todo-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.todo-checkbox.checked{background:var(--success);border-color:var(--success)}
.todo-checkbox.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.todo-content{flex:1;min-width:0}
.todo-text{font-size:13px;line-height:1.5}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-lighter)}
.todo-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;margin-left:4px}
.todo-tag.urgent{background:#FFEBEE;color:#C62828}
.todo-tag.important{background:var(--primary-light);color:var(--primary-dark)}
.todo-tag.normal{background:var(--accent-light);color:var(--accent-dark)}
.todo-del{color:var(--text-lighter);font-size:16px;cursor:pointer;padding:4px}
.todo-del:active{color:var(--danger)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border:1.5px dashed #f2d0d8;border-radius:var(--radius-sm);color:var(--text-light);font-size:13px;cursor:pointer;transition:all .2s;margin-top:8px;background:var(--jelly)}
.add-btn:active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* Quadrant */
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quadrant{border-radius:var(--radius-sm);padding:12px;min-height:120px;display:flex;flex-direction:column}
.quadrant.q1{background:linear-gradient(135deg,#FFE4EC,#FFF0F5)}
.quadrant.q2{background:linear-gradient(135deg,#FFF9E0,#FFFDE7)}
.quadrant.q3{background:linear-gradient(135deg,#E8F5E9,#F1F8E9)}
.quadrant.q4{background:linear-gradient(135deg,#E3F2FD,#F3E5F5)}
.quadrant .q-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.quadrant .q-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.quadrant .q-sub{font-size:10px;color:var(--text-light);margin-top:2px}
.quadrant .q-add-btn{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-light);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);flex-shrink:0}
.quadrant .q-list{flex:1;font-size:12px;color:var(--text);line-height:1.6}
.quadrant .q-empty{text-align:center;color:var(--text-lighter);font-size:11px;padding-top:16px}
.quadrant .q-item{display:flex;align-items:center;gap:4px;padding:3px 0}
.quadrant .q-item .q-del{color:var(--text-lighter);cursor:pointer;font-size:13px;margin-left:auto}

/* Plan - 周历条 & 子标签 */
.plan-weekbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--jelly);border-radius:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.plan-weekbar .pw-arrow{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.05);flex-shrink:0}
.plan-weekbar .pw-arrow:active{background:var(--primary-light)}
.pw-days{display:flex;gap:4px;flex:1;justify-content:space-between}
.pw-day{flex:1;text-align:center;padding:5px 0;border-radius:10px;cursor:pointer;transition:all .2s}
.pw-day .pw-dow{font-size:10px;color:var(--text-light)}
.pw-day .pw-num{font-size:14px;font-weight:600;color:var(--text);margin-top:1px}
.pw-day.today{background:var(--primary-light)}
.pw-day.today .pw-num{color:var(--primary-dark)}
.pw-day.selected{background:linear-gradient(135deg,var(--primary),var(--accent))}
.pw-day.selected .pw-dow,.pw-day.selected .pw-num{color:#fff}
.plan-subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.plan-subtabs::-webkit-scrollbar{display:none}
.plan-subtab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--bg);color:var(--text-light);cursor:pointer;transition:all .2s}
.plan-subtab.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 3px 10px rgba(255,107,157,.25)}
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cl-item:last-child{border-bottom:none}
.cl-check{width:22px;height:22px;border-radius:50%;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cl-check.checked{background:var(--success);border-color:var(--success)}
.cl-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.cl-text{flex:1;font-size:13px;line-height:1.5}
.cl-item.checked .cl-text{text-decoration:line-through;color:var(--text-lighter)}
.habit-card{padding:14px;border-radius:16px;background:var(--bg);margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.habit-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.habit-row>div:nth-child(2){flex:1;min-width:0}
.habit-dot{display:flex;gap:8px;justify-content:space-between;align-items:center}
.habit-dot .hd{flex:1;height:32px;border-radius:10px;background:var(--bg-secondary,#f5f5f5);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-light)}
.habit-dot .hd.done{background:linear-gradient(135deg,var(--primary),var(--accent));border-color:transparent;color:#fff}
.diary-mood{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.diary-mood .dm{font-size:24px;cursor:pointer;opacity:.5;transition:all .2s}
.diary-mood .dm.active{opacity:1;transform:scale(1.15)}
.diary-ta{width:100%;min-height:120px;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;background:#fff;color:var(--text)}
.diary-summary{background:var(--primary-lighter);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--text-light);line-height:1.7;margin-bottom:10px}

/* Plan */
.plan-summary-card{padding:16px}
.plan-summary-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plan-summary-title{font-size:18px;font-weight:700}
.plan-summary-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.plan-progress-box{flex:1;max-width:180px;margin-left:16px}
.plan-progress-box .ppb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-bottom:5px}
.plan-progress-box .ppb-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.plan-progress-box .ppb-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .3s}

/* Meal */
.meal-tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.meal-tab{flex:1;min-width:70px;text-align:center;padding:10px 8px;background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius-sm);font-size:12px;color:var(--text-light);cursor:pointer;box-shadow:var(--shadow-soft);border:2px solid transparent}
.meal-tab.active{border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.meal-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-soft);margin-bottom:12px;border:1px solid var(--jelly-bd)}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.meal-name{font-size:15px;font-weight:700}
.meal-cal{font-size:12px;color:var(--accent-dark);font-weight:600}
.meal-upload{width:100%;height:100px;border:2px dashed #f0d0d8;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-lighter);font-size:28px;cursor:pointer;overflow:hidden;background:var(--primary-lighter);margin-bottom:10px;position:relative}
.meal-upload img{width:100%;height:100%;object-fit:cover}
.meal-upload .del-img{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}

/* Finance */
.finance-hero{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:18px;color:#fff;margin-bottom:14px}
.finance-hero .fh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.finance-hero .fh-label{font-size:12px;opacity:.9}
.finance-hero .fh-amount{font-size:28px;font-weight:700}
.finance-hero .fh-budget{font-size:12px;opacity:.85}
.fh-budget-bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:8px}
.fh-budget-bar .fill{height:100%;background:#fff;border-radius:4px;transition:width .3s}
.fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fin-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.fin-card .fin-label{font-size:10px;color:var(--text-light)}
.fin-card .fin-num{font-size:16px;font-weight:700;margin-top:4px}
.fin-card.income .fin-num{color:var(--success)}
.fin-card.expense .fin-num{color:var(--danger)}
.fin-card.balance .fin-num{color:var(--accent-dark)}

/* Finance record page */
.fr-amount{font-size:28px;font-weight:700;text-align:center;padding:14px;background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);margin-bottom:12px;border:1px solid var(--jelly-bd);line-height:1.2;color:var(--text);transition:color .2s}
.fr-amount.income{color:var(--success)}
.fr-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.fr-cat{text-align:center;padding:8px 4px;border-radius:14px;background:var(--jelly);color:var(--text);cursor:pointer;border:1px solid var(--jelly-bd);box-shadow:var(--shadow-soft);transition:all .15s}
.fr-cat.active{background:linear-gradient(135deg,var(--primary),#FF8FB1);color:#fff;border-color:transparent}
.fr-cat i{font-size:18px;display:block;margin-bottom:2px;font-style:normal}
.fr-cat span{font-size:11px}
.fr-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fr-key{background:var(--jelly);border-radius:14px;padding:12px 8px;text-align:center;font-size:18px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd);user-select:none;transition:transform .1s}
.fr-key:active{transform:scale(.95)}
.fr-key.del{background:linear-gradient(135deg,var(--accent),#FFE082);color:#5D4037;font-size:14px}
.fr-records{margin-top:14px}
.fr-records-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
.fr-records-title{font-size:13px;font-weight:700}
.fr-records-total{font-size:13px;font-weight:600;color:var(--primary-dark)}
.fr-record{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--jelly);border-radius:12px;margin-bottom:6px;border:1px solid var(--jelly-bd);animation:frIn .2s}
@keyframes frIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fr-record-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary-light),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.fr-record-info{flex:1;min-width:0}
.fr-record-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-record-cat{font-size:11px;color:var(--text-light);margin-top:1px}
.fr-record-amount{font-size:14px;font-weight:700;color:var(--primary-dark);flex-shrink:0}
.fr-record-amount.income{color:var(--success)}
.fr-record-del{width:24px;height:24px;border-radius:50%;background:rgba(255,107,157,.1);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--primary);cursor:pointer;flex-shrink:0}
.fr-record-empty{text-align:center;padding:20px;color:var(--text-lighter);font-size:12px}

/* Word */
.word-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.word-card:active{transform:scale(.99)}
.word-card .w-word{font-size:22px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.word-card .w-phonetic{font-size:13px;color:var(--accent-dark);margin:6px 0}
.word-card .w-meaning{font-size:13px;color:var(--text-light)}
.word-example{background:var(--primary-light);border-radius:var(--radius-sm);padding:12px;margin-top:10px;display:none}
.word-example.show{display:block}
.word-game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.word-game-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:16px 10px;text-align:center;box-shadow:var(--shadow-soft);cursor:pointer;border:1px solid var(--jelly-bd)}
.word-game-card:active{transform:scale(.96)}
.word-game-card .wg-icon{font-size:32px;margin-bottom:6px}
.word-game-card .wg-name{font-size:13px;font-weight:600}
.word-game-card .wg-desc{font-size:11px;color:var(--text-light);margin-top:2px}

/* Exercise */
.exercise-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f9eef1}
.exercise-item:last-child{border-bottom:none}
.exercise-check{width:22px;height:22px;border-radius:6px;border:2px solid #e8ccd4;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.exercise-check.checked{background:var(--success);border-color:var(--success)}
.exercise-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.exercise-info{flex:1}
.exercise-name{font-size:13px;font-weight:600}
.exercise-meta{font-size:11px;color:var(--text-light);margin-top:2px}
.exercise-link{font-size:11px;color:var(--primary-dark);margin-top:2px}

/* Content cards (news/invest/AI/outfit) */
.cc-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.cc-card:active{transform:scale(.99)}
.cc-tags{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.cc-tag{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.cc-tag.xhs{background:#FF2442;color:#fff}
.cc-tag.dy{background:#000;color:#fff}
.cc-tag.wx{background:#07C160;color:#fff}
.cc-tag.bili{background:#FB7299;color:#fff}
.cc-tag.bd{background:#4E6EF2;color:#fff}
.cc-tag.cat{background:var(--primary-light);color:var(--primary-dark)}
.cc-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:4px}
.cc-desc{font-size:12px;color:var(--text-light);line-height:1.6}
.cc-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cc-link{font-size:11px;color:var(--primary-dark);cursor:pointer;display:flex;align-items:center;gap:3px}
.cc-fav{font-size:16px;cursor:pointer;transition:transform .15s}
.cc-fav:active{transform:scale(.8)}
.cc-fav.active{color:var(--accent-dark)}

/* Outfit */
.outfit-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.outfit-card .ot-title{font-size:13px;font-weight:600}
.outfit-card .ot-desc{font-size:12px;color:var(--text-light);margin-top:3px}
.outfit-card .ot-link{font-size:11px;color:var(--primary-dark);margin-top:4px;cursor:pointer}
.shop-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd);display:flex;align-items:center;gap:10px}
.shop-card .sc-emoji{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary-light),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

/* Travel */
.travel-fund{background:linear-gradient(135deg,var(--primary) 0%,#FFB088 50%,var(--accent) 100%);border-radius:var(--radius-lg);padding:20px;color:#fff;text-align:center;margin-bottom:14px}
.travel-fund .tf-label{font-size:12px;opacity:.9}
.travel-fund .tf-amount{font-size:32px;font-weight:700;margin:6px 0}
.travel-fund .tf-bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-top:8px}
.travel-fund .tf-bar .tf-fill{height:100%;background:#fff;border-radius:4px}
.travel-card{background:var(--jelly);backdrop-filter:blur(8px);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border:1px solid var(--jelly-bd)}
.travel-card .tr-title{font-size:14px;font-weight:700;margin-bottom:4px}
.travel-card .tr-desc{font-size:12px;color:var(--text-light);line-height:1.6}
.travel-card .tr-budget{font-size:11px;color:var(--primary-dark);margin-top:6px}

/* Modal & Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,107,157,.95);color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}

/* Favorites panel */
.fav-panel{position:fixed;top:0;right:0;width:300px;max-width:85vw;height:100%;background:var(--bg);z-index:280;transform:translateX(100%);transition:transform .3s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
.fav-panel.show{transform:translateX(0)}
.fav-panel .fp-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.fav-panel .fp-title{font-size:16px;font-weight:700}
.fav-panel .fp-close{font-size:20px;cursor:pointer;color:var(--text-light)}
.fav-panel .fp-tabs{display:flex;gap:4px;padding:8px 16px;overflow-x:auto}
.fav-panel .fp-tab{padding:6px 12px;border-radius:14px;font-size:12px;background:#fff;color:var(--text-light);cursor:pointer;flex-shrink:0}
.fav-panel .fp-tab.active{background:var(--primary);color:#fff}
.fav-panel .fp-list{padding:8px 16px}
.fav-panel .fp-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-soft)}
.fav-panel .fp-item .fi-title{font-size:13px;font-weight:600;margin-bottom:4px}
.fav-panel .fp-item .fi-meta{font-size:11px;color:var(--text-light)}
.fav-panel .fp-item .fi-del{font-size:14px;color:var(--text-lighter);cursor:pointer;margin-top:4px}
.fav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:270;display:none}
.fav-overlay.show{display:block}

/* Empty */
.empty{text-align:center;padding:30px 20px;color:var(--text-lighter)}
.empty .empty-icon{font-size:42px;margin-bottom:8px}
.empty .empty-text{font-size:13px}

/* Badge */
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.badge.yellow{background:var(--accent-light);color:var(--accent-dark)}

/* Responsive */
@media(min-width:768px){
#app{max-width:900px}
.side-nav{width:80px}
.nav-item{width:62px}
.comp-grid,.stat-grid{grid-template-columns:1fr 1fr 1fr}
.word-game-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:380px){
.nav-item .nav-label{font-size:9px}
.nav-item{width:48px;min-height:48px}
.side-nav{width:60px}
:root{--nav-w:60px}
}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div id="splashPetals"></div>
  <div class="splash-inner">
    <div class="splash-date" id="splashDate">--</div>
    <div class="splash-weather" id="splashWeather">📍 定位中...</div>
    <div class="splash-greeting" id="splashGreeting">早安，笑笑</div>

<script>
/* === Utilities === */
function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`}
function todayStr(){return dateStr(new Date())}
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return dateStr(d)}
function weekNum(s){const d=new Date(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));const y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/864e5)+1)/7)}
function fmtDate(s){const d=new Date(s);const w=['日','一','二','三','四','五','六'];return`${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`}
function parseDate(s){if(!s)return new Date();if(s instanceof Date)return s;const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return new Date(s)}
function monthStr(s){return s.slice(0,7)}
function monthWeek(s){const d=new Date(s);return Math.ceil(d.getDate()/7)}
function $(id){return document.getElementById(id)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms||10)}catch(e){}}

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function dayIdx(s){const d=parseDate(s);return Math.floor((d-new Date('2024-01-01'))/864e5)}

/* === Data: Words (loaded from words.json) === */
let EN_WORDS=[],RU_WORDS=[];
const REVIEW_INTERVALS=[1,2,4,7,15,30]; // Ebbinghaus intervals (days between reviews)

function getWordStates(lang){return load('wordStates_'+lang,{})}
function saveWordStates(lang,st){save('wordStates_'+lang,st)}
function getWordState(lang,word){const s=getWordStates(lang);return s[word]||null}
function isWordDue(lang,word,today){
  const st=getWordState(lang,word);
  if(!st||st.lv==='mastered'||st.lv==='new')return false;
  return new Date(st.reviewDate)<=new Date(today);
}
function markWordLearned(lang,word){
  const st=getWordStates(lang);
  if(!st[word]){st[word]={lv:'learning',learnDate:todayStr(),reviewDate:addDays(todayStr(),REVIEW_INTERVALS[0]),step:0,err:0,ok:0};saveWordStates(lang,st)}
}
function markWordReviewed(lang,word,correct){
  const st=getWordStates(lang);const w=st[word];if(!w)return;
  if(correct){w.step++;w.ok++;if(w.step>=REVIEW_INTERVALS.length){w.lv='mastered';w.reviewDate=null}else{w.reviewDate=addDays(todayStr(),REVIEW_INTERVALS[w.step]);w.lv='review'}}
  else{w.step=Math.max(0,w.step-1);w.err++;w.reviewDate=addDays(todayStr(),1);w.lv='learning'}
  st[word]=w;saveWordStates(lang,st);
}
function addErrorWord(lang,word){
  const eb=load('errorBook_'+lang,[]);
  const idx=eb.findIndex(e=>e.w===word);
  if(idx>=0){eb[idx].count++;eb[idx].lastDate=todayStr()}
  else{eb.push({w:word,count:1,lastDate:todayStr()})}
  save('errorBook_'+lang,eb);
}
function getMasteredCount(lang,level){
  const st=getWordStates(lang);const bank=lang==='en'?EN_WORDS:RU_WORDS;
  return bank.filter(w=>(!level||w.lv===level)&&st[w.w]&&st[w.w].lv==='mastered').length;
}
function getLevelProgress(lang,level){
  const bank=lang==='en'?EN_WORDS:RU_WORDS;
  const total=bank.filter(w=>w.lv===level).length;
  if(!total)return 0;
  return getMasteredCount(lang,level)/total;
}
function getUnlockedLevels(lang){
  const result=['core'];
  if(getLevelProgress(lang,'core')>=0.6)result.push('intermediate');
  if(getLevelProgress(lang,'intermediate')>=0.5)result.push('advanced');
  return result;
}

async fetchWeather(lat,lon,cityName){
try{
const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),6000);
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`,{signal:ctrl.signal});
clearTimeout(tid);
const j=await res.json();const cw=j.current_weather;
if(!cw)throw new Error('no data');
const wmo={'0':'☀️ 晴','1':'🌤️ 大部晴','2':'⛅ 多云','3':'☁️ 阴','45':'🌫️ 雾','48':'🌫️ 雾凇','51':'🌦️ 小毛雨','53':'🌦️ 毛雨','55':'🌧️ 中毛雨','61':'🌧️ 小雨','63':'🌧️ 中雨','65':'🌧️ 大雨','66':'🌧️ 冻雨','67':'🌧️ 冻雨','71':'🌨️ 小雪','73':'🌨️ 中雪','75':'❄️ 大雪','77':'❄️ 雪粒','80':'🌦️ 阵雨','81':'🌧️ 中阵雨','82':'🌧️ 强阵雨','95':'⛈️ 雷雨','96':'⛈️ 雷暴冰雹','99':'⛈️ 强雷暴'};
const code=String(cw.weathercode);
const entry=wmo[code]||'🌤️ 未知';
const icon=entry.split(' ')[0];
const text=entry.split(' ').slice(1).join(' ');
const temp=Math.round(cw.temperature);
const city=cityName||load('weather_city','我的位置');
const data={icon,temp,text,city,date:todayStr(),lat,lon};
save('weather_cache',data);
$('splashWeather').innerHTML=`<span onclick="App.pickCity()" style="cursor:pointer">${data.icon} ${data.temp}° ${data.text} · 📍 ${data.city} ✏️</span>`;
}catch(e){
const city=cityName||load('weather_city','');
$('splashWeather').innerHTML=`<span class="splash-weather-link" onclick="App.pickCity()">📍 ${city||'点击选择城市'} · 天气暂不可用</span>`;
}
},

}

},

analyzeUndone(undone){
const urgent=undone.filter(t=>t.q==='urgent').length;
const important=undone.filter(t=>t.q==='important').length;
let tips=[];
if(urgent>0)tips.push(`有${urgent}项紧急任务未完成，可能是今天安排过满，建议把非紧急任务移到明天。`);
if(important>0)tips.push(`有${important}项重要任务未完成，重要任务建议安排在精力最好的上午时段。`);
if(undone.length>5)tips.push(`未完成${undone.length}项偏多，建议每天核心任务不超过3个，其余作为弹性任务。`);
if(!tips.length)tips.push('今日完成情况不错，个别任务未完成属正常，明天继续加油！');
return tips.join('<br>');
},

getTodayWords(){
const arr=this.langSub==='en'?EN_WORDS:RU_WORDS;
if(!arr.length)return[];
const total=15+(monthWeek(this.currentDate)-1)*3;
const reviewQ=this.getReviewQueue();
const reviewCount=Math.min(Math.floor(total*0.3),reviewQ.length);
const newCount=total-reviewCount;
const unlocked=getUnlockedLevels(this.langSub);
const pool=arr.filter(w=>unlocked.includes(w.lv));
if(!pool.length)return[];
const reviewSet=new Set(reviewQ.map(w=>w.w));
const avail=pool.filter(w=>!getWordState(this.langSub,w.w)&&!reviewSet.has(w.w));
const daySeed=dayIdx(this.currentDate);
const newSlice=[];
if(avail.length){
const start=(daySeed*newCount)%avail.length;
for(let i=0;i<Math.min(newCount,avail.length);i++){newSlice.push(avail[(start+i)%avail.length])}
}
const reviewSlice=reviewQ.slice(0,reviewCount);
const result=[...newSlice,...reviewSlice].slice(0,total);
return result;
},
getReviewQueue(){
const arr=this.langSub==='en'?EN_WORDS:RU_WORDS;
if(!arr.length)return[];
const today=this.currentDate;
return arr.filter(w=>isWordDue(this.langSub,w.w,today));
},
reviewWord(word,correct){
if(this.currentDate!==todayStr()){toast('请回到今天再复习');return}
markWordReviewed(this.langSub,word,correct);
haptic(correct?20:40);
if(!correct)addErrorWord(this.langSub,word);
this.renderPage('language');
},

<div class="input-group"><textarea class="textarea" id="guideContent" style="min-height:240px;white-space:pre-wrap;font-size:12px;line-height:1.8">${escapeHtml(guide)}</textarea></div>
<div class="row"><button class="btn btn-primary" onclick="App.saveTravelGuide('${escapeHtml(t.name)}')">💾 保存</button><button class="btn btn-outline" onclick="App.resetTravelGuide(${i})">↺ 恢复默认</button></div>`);
},
saveTravelGuide(name){const v=$('guideContent').value;const g=load('travelGuides',{});g[name]=v;save('travelGuides',g);this.closeModal();toast('攻略已保存')},
resetTravelGuide(i){const t=TRAVEL[i];const g=load('travelGuides',{});delete g[t.name];save('travelGuides',g);this.closeModal();this.openTravelGuide(i);toast('已恢复默认')},
openTravelPlans(i){
const t=TRAVEL[i];
const plans=['省钱','舒适','拍照'];
const planEmojis={'省钱':'💰','舒适':'🌟','拍照':'📸'};
this.openModal(t.emoji+' '+t.name+' · 三套方案',`
<div style="font-size:12px;color:var(--text-light);margin-bottom:12px">预算 ¥${t.budget} · ${t.days}天 · ${t.tags.join('、')}</div>
${plans.map(p=>{const pl=TRAVEL_PLANS[p];const d=pl.detail;return`<div class="cc-card" style="margin-bottom:12px">
<div class="cc-tags"><span class="cc-tag cat">${planEmojis[p]} ${p}方案</span></div>
<div style="font-size:13px;font-weight:600;margin-bottom:6px">${p}出行方案</div>
<div style="font-size:12px;color:var(--text-light);line-height:1.7;margin-bottom:8px">${pl.summary}</div>
<div style="font-size:12px;line-height:2;background:var(--primary-lighter);border-radius:10px;padding:10px 12px">
<div><span style="font-weight:600;color:var(--primary-dark)">🏨 住宿</span>：${d.住宿}</div>
<div><span style="font-weight:600;color:var(--primary-dark)">🚗 交通</span>：${d.交通}</div>
<div><span style="font-weight:600;color:var(--primary-dark)">🍽️ 餐饮</span>：${d.餐饮}</div>
<div><span style="font-weight:600;color:var(--primary-dark)">🎯 景点</span>：${d.景点}</div>
<div><span style="font-weight:600;color:var(--primary-dark)">🛍️ 购物</span>：${d.购物}</div>
<div><span style="font-weight:600;color:var(--primary-dark)">💡 贴士</span>：${d.tips}</div>
</div>
<button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="App.saveTravelPlan('${escapeHtml(t.name)}','${p}')">💾 保存此方案</button>
</div>`}).join('')}`);
},
saveTravelPlan(name,plan){
const saved=load('savedPlans',[]);saved.unshift({name,plan,date:todayStr(),id:Date.now()+''});
save('savedPlans',saved);toast('方案已保存');haptic(15);
},
addTravelFund(){const amt=prompt('存入金额：');if(!amt)return;const fund=load('travelFund',{target:8000,current:0});fund.current+=+amt;save('travelFund',fund);this.renderPage('travel');toast('已存入 ¥'+amt)},
editTravelFund(){
const fund=load('travelFund',{target:8000,current:0,name:'旅行基金'});
this.openModal('编辑旅行基金',`
<div class="input-group"><label>基金名称</label><input class="input" id="tfName" value="${escapeHtml(fund.name)}"></div>
<div class="input-group"><label>目标金额</label><input class="input" type="number" id="tfTarget" value="${fund.target}"></div>
<div class="input-group"><label>当前金额</label><input class="input" type="number" id="tfCurrent" value="${fund.current}"></div>
<button class="btn btn-primary btn-block" onclick="App.saveTravelFund()">保存</button>`);
},
saveTravelFund(){const fund=load('travelFund',{target:8000,current:0,name:'旅行基金'});fund.name=$('tfName').value;fund.target=+($('tfTarget').value||0);fund.current=+($('tfCurrent').value||0);save('travelFund',fund);this.closeModal();this.renderPage('travel');toast('已更新')},
openTravelAccounting(){
const records=load('travelExpense',[]);
this.openModal('🧾 旅游记账',`
<div class="input-group"><label>支出项目</label><input class="input" id="teName" placeholder="如：住宿"></div>
<div class="row"><div class="input-group"><label>金额</label><input class="input" type="number" id="teAmt" placeholder="0"></div><div class="input-group"><label>分类</label><select class="select" id="teCat"><option>交通</option><option>住宿</option><option>餐饮</option><option>门票</option><option>购物</option><option>其他</option></select></div></div>
<button class="btn btn-primary btn-block" onclick="App.addTravelExpense()">添加</button>
<div style="margin-top:12px">${records.length?records.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f9eef1"><span style="font-size:12px">${r.cat}·${r.name}</span><span style="font-size:12px;font-weight:600">¥${r.amt}</span></div>`).join(''):'<div class="empty"><div class="empty-text">暂无记录</div></div>'}</div>
${records.length?`<div style="margin-top:8px;padding:8px;background:var(--primary-light);border-radius:10px;font-size:12px"><b>总计：¥${records.reduce((s,r)=>s+(+r.amt||0),0)}</b></div><button class="btn btn-yellow btn-block" style="margin-top:8px" onclick="App.syncTravelExpense()">💰 一键同步到财务</button>`:''}
`);
},
addTravelExpense(){
const name=$('teName').value.trim(),amt=+$('teAmt').value,cat=$('teCat').value;
if(!name||!amt){toast('请填写完整');return}
const records=load('travelExpense',[]);records.push({name,amt,cat,date:todayStr()});
save('travelExpense',records);this.closeModal();this.openTravelAccounting();toast('已添加');haptic(15);
},
syncTravelExpense(){
const records=load('travelExpense',[]);if(!records.length){toast('暂无记录');return}
const d=this.dayData(this.currentDate);d.finance=d.finance||[];
records.forEach(r=>{d.finance.push({type:'expense',amount:r.amt,cat:'other',note:'旅行-'+r.name})});
this.saveDay(this.currentDate,d);
save('travelExpense',[]);this.closeModal();toast(`已同步${records.length}笔到财务`);haptic(20);
},

/* === FINANCE === */
renderFinance(){
const inner=this.financeSub==='detail'?this.renderFinanceDetail():(this.financeSub==='chart'?this.renderFinanceChart():this.renderFinanceRecord());
return`<div class="finance-page">${inner}</div>`+this.renderFinanceTabs();
},
renderFinanceTabs(){
return`<div class="sub-tab-row" style="position:fixed;bottom:0;left:var(--nav-w);right:0;max-width:560px;margin:0 auto;background:var(--jelly);backdrop-filter:blur(12px);z-index:50;padding:6px 10px;border-top:1px solid var(--jelly-bd)">
<div class="sub-tab ${this.financeSub==='detail'?'active':''}" onclick="App.setFinanceSub('detail');haptic(10)">📊 明细</div>
<div class="sub-tab ${this.financeSub==='chart'?'active':''}" onclick="App.setFinanceSub('chart');haptic(10)">📈 图表</div>
<div class="sub-tab ${this.financeSub==='record'?'active':''}" onclick="App.setFinanceSub('record');haptic(10)">✍️ 记账</div>
</div>`;
},
setFinanceSub(s){this.financeSub=s;this.renderPage('finance')},
renderFinanceDetail(){
const d=this.dayData(this.currentDate);const fin=d.finance||[];
const exp=fin.filter(i=>i.type!=='income').reduce((a,b)=>a+(+b.amount||0),0);
const inc=fin.filter(i=>i.type==='income').reduce((a,b)=>a+(+b.amount||0),0);
const bal=inc-exp;
return`<div class="finance-hero">
<div class="fh-row"><div><div class="fh-label">今日支出</div><div class="fh-amount">¥${exp.toFixed(0)}</div></div><div style="text-align:right"><div class="fh-label">今日收入</div><div style="font-size:20px;font-weight:700">¥${inc.toFixed(0)}</div></div></div>
<div class="fh-budget">结余 ¥${bal.toFixed(0)}</div>
</div>
<div class="fin-grid"><div class="fin-card expense"><div class="fin-label">支出</div><div class="fin-num">¥${exp.toFixed(0)}</div></div><div class="fin-card income"><div class="fin-label">收入</div><div class="fin-num">¥${inc.toFixed(0)}</div></div><div class="fin-card balance"><div class="fin-label">结余</div><div class="fin-num">¥${bal.toFixed(0)}</div></div></div>
<div class="section-title">今日明细</div>
<div class="card">${fin.length?fin.map((r,i)=>{const cat=FINANCE_CATS[r.type]?.find(c=>c.k===r.cat)||{i:'🧩',n:'其他'};return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f9eef1"><div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary-light),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:16px">${cat.i}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${escapeHtml(r.note||cat.n)}</div><div style="font-size:11px;color:var(--text-light)">${cat.n}</div></div><div style="font-size:14px;font-weight:700;color:${r.type==='income'?'var(--success)':'var(--primary-dark)'}">${r.type==='income'?'+':'-'}¥${r.amount}</div><div style="cursor:pointer;color:var(--text-lighter)" onclick="App.delRecord(${i})">×</div></div>`}).join(''):'<div class="empty"><div class="empty-text">今日还没有记账</div></div>'}</div>`;
},
renderFinanceChart(){
const items=[];for(let i=6;i>=0;i--){const ds=addDays(todayStr(),-i);const d=this.dayData(ds);const fin=d.finance||[];items.push({date:ds,exp:fin.filter(f=>f.type!=='income').reduce((a,b)=>a+(+b.amount||0),0),inc:fin.filter(f=>f.type==='income').reduce((a,b)=>a+(+b.amount||0),0)})}
const maxVal=Math.max(...items.map(i=>Math.max(i.exp,i.inc)),1);
return`<div class="section-title">📈 近7天收支</div>
<div class="card">
<div style="display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px">
${items.map(it=>{const eh=maxVal?it.exp/maxVal*100:0;const ih=maxVal?it.inc/maxVal*100:0;const dt=new Date(it.date);const isToday=it.date===todayStr();return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:9px;color:var(--text-light)">${it.exp||''}</div><div style="display:flex;gap:2px;align-items:flex-end;height:80px"><div style="width:10px;height:${eh}px;border-radius:3px;background:var(--primary)"></div><div style="width:10px;height:${ih}px;border-radius:3px;background:var(--success)"></div></div><div style="font-size:9px;color:${isToday?'var(--primary)':'var(--text-light)'}">${dt.getDate()}</div></div>`}).join('')}
</div>
<div style="display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--text-light)"><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--primary);margin-right:3px"></span>支出</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--success);margin-right:3px"></span>收入</span></div>
</div>
${this.renderCategoryRank()}`;
},
renderCategoryRank(){
const d=this.dayData(this.currentDate);const fin=d.finance||[];
const catMap={};fin.filter(f=>f.type!=='income').forEach(f=>{catMap[f.cat]=(catMap[f.cat]||0)+(+f.amount||0)});
const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
const total=cats.reduce((s,[,v])=>s+v,0);
if(!cats.length)return'';
return`<div class="section-title">📊 今日分类</div><div class="card">${cats.map(([k,v])=>{const cat=FINANCE_CATS.expense.find(c=>c.k===k)||{i:'🧩',n:'其他'};const pct=total?Math.round(v/total*100):0;return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f9eef1"><div style="font-size:16px">${cat.i}</div><div style="flex:1;font-size:13px">${cat.n}</div><div style="font-size:13px;font-weight:700">¥${v}</div><div style="font-size:11px;color:var(--text-light);width:36px;text-align:right">${pct}%</div></div>`}).join('')}</div>`;
},
renderFinanceRecord(){
const type=this.financeRecordType||'expense';const cats=FINANCE_CATS[type];const amount=this.financeRecordAmount||'';
const d=this.dayData(this.currentDate);const records=d.finance||[];const todayRecords=records.filter(r=>r.type===type);
const todayTotal=todayRecords.reduce((s,r)=>s+(+r.amount||0),0);
const recordList=todayRecords.length?`<div class="fr-records-head"><span class="fr-records-title">今日${type==='income'?'收入':'支出'}</span><span id="frRecordTotal" class="fr-records-total">¥${todayTotal}</span></div>
<div id="frRecordList">${todayRecords.map((r,i)=>{const realIdx=records.indexOf(r);const cat=FINANCE_CATS[type]?.find(c=>c.k===r.cat)||{i:'🧩',n:'其他'};return this.renderRecordItem(r,cat,realIdx,type)}).join('')}</div>`:`<div class="fr-record-empty">今日还没有记账，记一笔吧～</div>`;
return`<div class="section-title"><span>记一笔</span></div>
<div class="sub-tab-row"><div class="sub-tab ${type==='expense'?'active':''}" onclick="App.setFinanceRecordType('expense')">支出</div><div class="sub-tab ${type==='income'?'active':''}" style="${type==='income'?'background:linear-gradient(135deg,var(--success),#81C784)':''}" onclick="App.setFinanceRecordType('income')">收入</div></div>
<div id="frAmount" class="fr-amount ${type==='income'?'income':''}">¥${amount||'0'}</div>
<div id="frCats" class="fr-cats">
${cats.map(c=>`<div class="fr-cat ${this.financeRecordCat===c.k?'active':''}" data-cat="${c.k}" onclick="App.setFinanceRecordCat('${c.k}')"><i>${c.i}</i><span>${c.n}</span></div>`).join('')}
</div>
<div class="input-group"><input class="input" id="recNote" value="${escapeHtml(this.financeRecordNote||'')}" placeholder="备注（例如：午餐）" oninput="App.financeRecordNote=this.value"></div>
<div class="fr-pad">
${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="fr-key" onclick="App.inputRecordAmount('${n}');haptic(8)">${n}</div>`).join('')}
<div class="fr-key" onclick="App.inputRecordAmount('.');haptic(8)">.</div>
<div class="fr-key" onclick="App.inputRecordAmount('0');haptic(8)">0</div>
<div class="fr-key del" onclick="App.inputRecordAmount('del');haptic(20)">⌫</div>
</div>
<button class="btn btn-primary btn-block" onclick="App.saveRecord()">保存</button>
<div id="frRecords" class="fr-records">${recordList}</div>`;
},
renderRecordItem(r,cat,idx,type){
return`<div class="fr-record" data-idx="${idx}"><div class="fr-record-icon">${cat.i}</div><div class="fr-record-info"><div class="fr-record-name">${escapeHtml(r.note||cat.n)}</div><div class="fr-record-cat">${cat.n}</div></div><div class="fr-record-amount ${type==='income'?'income':''}">${type==='income'?'+':'-'}¥${r.amount}</div><div class="fr-record-del" onclick="App.delRecord(${idx})">×</div></div>`;
},
setFinanceRecordType(t){this.financeRecordType=t;this.financeRecordCat=FINANCE_CATS[t][0].k;this.renderPage('finance');haptic(12)},
setFinanceRecordCat(k){
this.financeRecordCat=k;
const cats=$('frCats');if(cats){
  cats.querySelectorAll('.fr-cat').forEach(el=>el.classList.toggle('active',el.dataset.cat===k));
}
haptic(10)
},
inputRecordAmount(k){
let a=this.financeRecordAmount||'';
if(k==='del'){a=a.slice(0,-1)}else if(k==='.'&&a.includes('.')){}else if(a.length<8){a+=k}
this.financeRecordAmount=a;
const el=$('frAmount');if(el)el.textContent='¥'+(a||'0');
},
saveRecord(){
const amount=parseFloat(this.financeRecordAmount||'0');
if(!amount){toast('请输入金额');return}
const d=this.dayData(this.currentDate);
d.finance=d.finance||[];
const rec={type:this.financeRecordType||'expense',amount,cat:this.financeRecordCat,note:this.financeRecordNote||''};
d.finance.push(rec);
this.saveDay(this.currentDate,d);
const realIdx=d.finance.length-1;
const type=this.financeRecordType||'expense';
const cat=FINANCE_CATS[type]?.find(c=>c.k===rec.cat)||{i:'🧩',n:'其他'};
const recordsContainer=$('frRecords');
if(recordsContainer){
  const empty=recordsContainer.querySelector('.fr-record-empty');
  if(empty){
    recordsContainer.innerHTML=`<div class="fr-records-head"><span class="fr-records-title">今日${type==='income'?'收入':'支出'}</span><span id="frRecordTotal" class="fr-records-total">¥${amount}</span></div><div id="frRecordList">${this.renderRecordItem(rec,cat,realIdx,type)}</div>`;
  }else{
    const list=$('frRecordList');const total=$('frRecordTotal');
    if(list)list.insertAdjacentHTML('beforeend',this.renderRecordItem(rec,cat,realIdx,type));
    if(total){const cur=parseFloat(total.textContent.replace(/[¥,+]/g,'')||0);total.textContent='¥'+(cur+amount).toFixed(0)}
  }
}
this.financeRecordAmount='';this.financeRecordNote='';
const noteInput=$('recNote');if(noteInput)noteInput.value='';
const amountEl=$('frAmount');if(amountEl)amountEl.textContent='¥0';
this.updateHome();toast('已记账');haptic(30)
},
delRecord(i){
const d=this.dayData(this.currentDate);if(d.finance&&d.finance[i]){
  const removedAmount=+d.finance[i].amount||0;
  d.finance.splice(i,1);this.saveDay(this.currentDate,d);
  const row=document.querySelector(`.fr-record[data-idx="${i}"]`);
  if(row){row.style.opacity='0';row.style.transform='translateX(20px)';setTimeout(()=>{
    row.remove();
    document.querySelectorAll(`.fr-record`).forEach(el=>{const ei=+el.dataset.idx;if(ei>i)el.dataset.idx=ei-1});
    const list=$('frRecordList');
    if(list&&list.children.length===0&&$('frRecords')){const type=this.financeRecordType||'expense';$('frRecords').innerHTML=`<div class="fr-record-empty">今日还没有记账，记一笔吧～</div>`}
  },180)}
  const total=$('frRecordTotal');if(total){const cur=parseFloat(total.textContent.replace(/[¥,+]/g,'')||0);const next=Math.max(0,cur-removedAmount);total.textContent='¥'+next.toFixed(0)}
  this.updateHome();toast('已删除');haptic(20)
}
},

/* === FAVORITES === */
openFavPanel(){
const types=[{k:'news',n:'新闻'},{k:'invest',n:'理财'},{k:'ai',n:'AI'},{k:'outfit',n:'穿搭'}];
let html='<div class="fp-head"><div class="fp-title">⭐ 我的收藏</div><div class="fp-close" onclick="App.closeFavPanel()">×</div></div>';
html+=`<div class="fp-tabs">${types.map(t=>`<div class="fp-tab ${this.favTab===t.k?'active':''}" onclick="App.setFavTab('${t.k}')">${t.n}</div>`).join('')}</div>`;
const fav=load('favs_'+this.favTab,[]);
html+=`<div class="fp-list">${fav.length?fav.map((f,i)=>`<div class="fp-item"><div class="fi-title">${escapeHtml(f.title)}</div>${f.desc?`<div class="fi-meta">${escapeHtml(f.desc)}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><a href="${f.link||'#'}" target="_blank" style="font-size:11px;color:var(--primary-dark)">查看原文 →</a><span class="fi-del" onclick="App.delFav('${this.favTab}',${i})">删除</span></div></div>`).join(''):'<div class="empty"><div class="empty-icon">⭐</div><div class="empty-text">暂无收藏</div></div>'}</div>`;
$('favPanel').innerHTML=html;$('favPanel').classList.add('show');$('favOverlay').classList.add('show');
},
closeFavPanel(){$('favPanel').classList.remove('show');$('favOverlay').classList.remove('show')},
setFavTab(t){this.favTab=t;this.openFavPanel()},
delFav(type,i){const fav=load('favs_'+type,[]);fav.splice(i,1);save('favs_'+type,fav);this.openFavPanel();toast('已删除');haptic(15)},

/* === HELPERS === */
calcStreak(){let s=0;let d=todayStr();while(1){const dd=this.dayData(d);const total=(dd.todos?.work?.length||0)+(dd.todos?.personal?.length||0);const done=(dd.todos?.work?.filter(t=>t.done).length||0)+(dd.todos?.personal?.filter(t=>t.done).length||0);if(total>0&&done===total)s++;else if(d===todayStr()){}else break;d=addDays(d,-1);if(s>30)break}return s},
getTodaySpend(){const d=this.dayData(this.currentDate);return(d.finance||[]).filter(i=>i.type!=='income').reduce((a,b)=>a+(+b.amount||0),0)},
getMealCount(){const d=this.dayData(this.currentDate);return Object.values(d.diet||{}).filter(m=>m.name||m.img).length},
getExerciseMin(){const d=this.dayData(this.currentDate);const done=d.exerciseDone||{};const types=load('exerciseTypes',EXERCISE_TYPES);let m=0;for(const k in done){const item=this.findExerciseItem(k,types);if(item)m+=item.min}return m},
exerciseDone(){const d=this.dayData(this.currentDate);return!!(d.exerciseDone&&Object.keys(d.exerciseDone).length)},
calcExerciseStreak(){let s=0;let d=todayStr();while(1){const dd=this.dayData(d);if(dd.exerciseDone&&Object.keys(dd.exerciseDone).length)s++;else if(d===todayStr()){}else break;d=addDays(d,-1);if(s>30)break}return s},
updateHome(){if(this.currentPage==='home')this.renderPage('home')},
openModal(title,html){$('modalContent').innerHTML=`<div class="modal-title">${title}</div>${html}`;$('modalOverlay').classList.add('show')},
closeModal(e){if(e&&e.target!==$('modalOverlay'))return;$('modalOverlay').classList.remove('show')},
bindKeys(){document.addEventListener('keydown',e=>{if(e.key==='Escape'){this.closeModal();this.closeFavPanel()}})}
};
App.init();
</script>
