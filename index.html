  switchOutfitTab(t){this.outfitTab=t;this.renderPage('outfit');},
  bloggerWebUrl(key){const b=OUTFIT_BLOGGERS[key];const p=OUTFIT_PLATFORMS[b.platform];return p.web+encodeURIComponent(b.kw||b.name);},
  bloggerAppUrl(key){const b=OUTFIT_BLOGGERS[key];const p=OUTFIT_PLATFORMS[b.platform];return p.app+encodeURIComponent(b.kw||b.name);},
  openBloggerLink(key){
    const b=OUTFIT_BLOGGERS[key];
    if(navigator.clipboard){navigator.clipboard.writeText(b.kw||b.name);}
    const web=this.bloggerWebUrl(key);
    const start=Date.now();
    try{window.location.href=this.bloggerAppUrl(key);}catch(e){}
    setTimeout(()=>{if(Date.now()-start<1200)window.location.href=web;},600);
  },
  openBloggerSearch(key,kw){
    const b=OUTFIT_BLOGGERS[key];const p=OUTFIT_PLATFORMS[b.platform];
    const q=encodeURIComponent(kw||b.kw||b.name);
    if(navigator.clipboard){navigator.clipboard.writeText(kw||b.kw||b.name);}
    const web=p.web+q;
    const start=Date.now();
    try{window.location.href=p.app+q;}catch(e){}
    setTimeout(()=>{if(Date.now()-start<1200)window.location.href=web;},600);
  },
  copyBloggerName(name){
    if(navigator.clipboard){navigator.clipboard.writeText(name).then(()=>toast('已复制：'+name));}
    else{toast('请手动复制：'+name);}
  },
  uploadOutfit(){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{save('outfitImg',r.result);this.renderPage('outfit');toast('图片已保存')};r.readAsDataURL(file);};inp.click();
  },

  /* ===== TRAVEL ===== */
  /* ===== TRAVEL ===== */
  travelTab:'all',
  renderTravel(){
    const fund=load('travelFund',{target:8000,current:2200,name:'旅行基金'});
    const pct=Math.min(100,Math.round(fund.current/fund.target*100));
    const list=load('travelListV2',[]);
    const counts={want:list.filter(x=>x.status==='want').length,plan:list.filter(x=>x.status==='plan').length,done:list.filter(x=>x.status==='done').length};
    const filtered=this.travelTab==='all'?list:list.filter(x=>x.status===this.travelTab);
    const renderItem=t=>{
      const icon={want:'📍',plan:'📅',done:'✅'}[t.status]||'📍';
      const statusText={want:'想去',plan:'规划中',done:'已去'}[t.status];
      return `<div class="travel-list-item">
        <div class="tli-icon">${icon}</div>
        <div class="tli-body">
          <div class="tli-name">${escapeHtml(t.name)} <span style="font-size:10px;color:var(--primary-dark)">${statusText}</span></div>
          <div class="tli-meta">${t.date||'待定'} · ${t.budget?'预算 ¥'+t.budget:''}</div>
          ${t.note?`<div class="tli-note">${escapeHtml(t.note)}</div>`:''}
          <div class="tli-actions">
            ${t.status!=='want'?`<button class="btn btn-ghost btn-sm" onclick="App.setTravelStatus('${t.id}','want')">标为想去</button>`:''}
            ${t.status!=='plan'?`<button class="btn btn-ghost btn-sm" onclick="App.setTravelStatus('${t.id}','plan')">标为规划中</button>`:''}
            ${t.status!=='done'?`<button class="btn btn-primary btn-sm" onclick="App.setTravelStatus('${t.id}','done')">标为已去</button>`:''}
            <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="App.delTravel('${t.id}')">删除</button>
          </div>
        </div>
      </div>`;
    };
    return `
    <div class="travel-fund">
      <div class="tf-label">${fund.name}</div>
      <div class="tf-amount">¥${fund.current}</div>
      <div style="font-size:12px;opacity:.9">目标 ¥${fund.target} · 已完成 ${pct}%</div>
      <div class="tf-bar"><div class="tf-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:center">
        <button class="btn btn-yellow btn-sm" onclick="App.addTravelFund()">+ 存入</button>
        <button class="btn btn-ghost btn-sm" onclick="App.editTravelFund()">编辑</button>
      </div>
    </div>
    <div class="travel-stats">
      <div class="travel-stat"><div class="ts-num">${counts.want}</div><div class="ts-icon">📍</div><div class="ts-label">想去</div></div>
      <div class="travel-stat"><div class="ts-num">${counts.plan}</div><div class="ts-icon">📅</div><div class="ts-label">规划中</div></div>
      <div class="travel-stat"><div class="ts-num">${counts.done}</div><div class="ts-icon">✅</div><div class="ts-label">已去</div></div>
    </div>
    <div class="travel-tabs">
      <div class="travel-tab ${this.travelTab==='all'?'active':''}" onclick="App.setTravelTab('all')">全部</div>
      <div class="travel-tab ${this.travelTab==='want'?'active':''}" onclick="App.setTravelTab('want')">想去</div>
      <div class="travel-tab ${this.travelTab==='plan'?'active':''}" onclick="App.setTravelTab('plan')">规划中</div>
      <div class="travel-tab ${this.travelTab==='done'?'active':''}" onclick="App.setTravelTab('done')">已去</div>
    </div>
    <div class="travel-form">
      <div class="tf-title"><span>✚</span> 添加旅行</div>
      <input class="tf-input" id="trName" placeholder="目的地名，如：日本京都">
      <input class="tf-input" id="trDate" placeholder="计划日期，如：2027年春">
      <input class="tf-input" id="trBudget" placeholder="预算金额，如：5000" type="number">
      <input class="tf-input" id="trNote" placeholder="想说点什么（行程/期待/感受）...">
      <div class="tf-status">
        <div class="chip ${this.travelNewStatus==='want'?'active':''}" onclick="App.setTravelNewStatus('want')">📍 想去</div>
        <div class="chip ${this.travelNewStatus==='plan'?'active':''}" onclick="App.setTravelNewStatus('plan')">📅 规划中</div>
        <div class="chip ${this.travelNewStatus==='done'?'active':''}" onclick="App.setTravelNewStatus('done')">✅ 已完成</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="App.addTravel()">添加到旅行清单</button>
    </div>
    ${filtered.length?filtered.map(renderItem).join(''):`<div class="empty"><div class="empty-icon">✈️</div><div class="empty-text">暂无${this.travelTab==='all'?'旅行记录':(this.travelTab==='want'?'想去的地方':(this.travelTab==='plan'?'规划中的行程':'已完成的旅行'))}</div></div>`}
    <div class="travel-insp">
      <div class="ti-title"><span>💡</span>旅行灵感推荐</div>
      <div style="font-size:11px;color:var(--text-light);margin-bottom:8px">人少 · 好吃 · 好看 · 每年1-2次</div>
      ${TRAVEL.map((t,i)=>`<div class="travel-insp-card">
        <div class="tic-img">${t.emoji||'🌏'}</div>
        <div class="tic-body" onclick="App.openTravelGuide(${i})" style="cursor:pointer">
          <div class="tic-name">${t.name}</div>
          <div class="tic-tags">${t.tags.map(tag=>`<span>${tag}</span>`).join('')}</div>
          <div class="tic-desc">${t.desc} · 建议 ¥${t.budget}/${t.days}天</div>
          <div style="font-size:11px;color:var(--primary);margin-top:4px">📋 点击查看详细攻略</div>
        </div>
        <div class="tic-add" onclick="App.addInspTravel('${escapeHtml(t.name)}',${t.budget},'${t.days}')">+</div>
      </div>`).join('')}
    </div>`;
  },
  travelNewStatus:'want',
  setTravelNewStatus(s){this.travelNewStatus=s;this.renderPage('travel');},
  setTravelTab(s){this.travelTab=s;this.renderPage('travel');},
  addTravel(){
    const name=$('trName').value.trim();if(!name){toast('请输入目的地');return;}
    const date=$('trDate').value.trim();const budget=$('trBudget').value.trim();const note=$('trNote').value.trim();
    const list=load('travelListV2',[]);
    list.unshift({id:Date.now()+'',name,date,budget,note,status:this.travelNewStatus});
    save('travelListV2',list);
    $('trName').value='';$('trDate').value='';$('trBudget').value='';$('trNote').value='';
    this.renderPage('travel');toast('已添加');
  },
  addInspTravel(name,budget,days){
    const list=load('travelListV2',[]);
    list.unshift({id:Date.now()+'',name,date:'规划中',budget:budget,note:`计划${days}天`,status:'want'});
    save('travelListV2',list);this.renderPage('travel');toast('已加入清单');
  },
  openTravelGuide(i){
    const t=TRAVEL[i];
    const customGuides=load('travelGuides',{});
    const guide=customGuides[t.name]||t.guide||'暂无攻略';
    this.openModal(t.emoji+' '+t.name+' 详细攻略',`
      <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">预算 ¥${t.budget} · ${t.days}天 · ${t.tags.join('、')}</div>
      <div class="input-group"><label>攻略内容（可编辑保存）</label><textarea class="textarea" id="guideContent" style="min-height:280px;white-space:pre-wrap;font-size:12px;line-height:1.8">${escapeHtml(guide)}</textarea></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-primary" style="flex:1" onclick="App.saveTravelGuide('${escapeHtml(t.name)}')">💾 保存攻略</button>
        <button class="btn btn-outline" onclick="App.resetTravelGuide(${i})">↺ 恢复默认</button>
      </div>
      <div style="font-size:11px;color:var(--text-lighter);margin-top:8px;text-align:center">攻略保存后仅在本设备生效，可随时编辑</div>
    `);
  },
  saveTravelGuide(name){
    const v=$('guideContent').value;
    const g=load('travelGuides',{});g[name]=v;save('travelGuides',g);
    this.closeModal();toast('攻略已保存');
  },
  resetTravelGuide(i){
    const t=TRAVEL[i];const g=load('travelGuides',{});delete g[t.name];save('travelGuides',g);
    this.closeModal();this.openTravelGuide(i);toast('已恢复默认攻略');
  },
  setTravelStatus(id,status){
    const list=load('travelListV2',[]);const item=list.find(x=>x.id===id);if(item){item.status=status;save('travelListV2',list);this.renderPage('travel');toast('状态已更新');}
  },
  delTravel(id){
    if(!confirm('确定删除这条旅行记录？'))return;
    const list=load('travelListV2',[]).filter(x=>x.id!==id);save('travelListV2',list);this.renderPage('travel');toast('已删除');
  },
  addTravelFund(){const amt=prompt('存入金额：');if(!amt)return;const fund=load('travelFund',{target:8000,current:0});fund.current+=+amt;save('travelFund',fund);this.renderPage('travel');toast('已存入')},
  editTravelFund(){
    const fund=load('travelFund',{target:8000,current:0,name:'旅行基金'});
    this.openModal('编辑旅行基金',`
      <div class="input-group"><label>基金名称</label><input class="input" id="tfName" value="${escapeHtml(fund.name)}"></div>
      <div class="input-group"><label>目标金额</label><input class="input" type="number" id="tfTarget" value="${fund.target}"></div>
      <div class="input-group"><label>当前金额</label><input class="input" type="number" id="tfCurrent" value="${fund.current}"></div>
      <button class="btn btn-primary btn-block" onclick="App.saveTravelFund()">保存</button>
    `);
  },
  saveTravelFund(){
    const fund=load('travelFund',{target:8000,current:0,name:'旅行基金'});
    fund.name=$('tfName').value;fund.target=+($('tfTarget').value||0);fund.current=+($('tfCurrent').value||0);
    save('travelFund',fund);this.closeModal();this.renderPage('travel');toast('旅行基金已更新');
  },

  /* ===== Helpers ===== */
  calcStreak(){
    let s=0;let d=todayStr();while(1){const dd=this.dayData(d);const total=(dd.todos?.work?.length||0)+(dd.todos?.personal?.length||0);const done=(dd.todos?.work?.filter(t=>t.done).length||0)+(dd.todos?.personal?.filter(t=>t.done).length||0);if(total>0&&done===total)s++;else if(d===todayStr()){}else break;d=addDays(d,-1);if(s>30)break;}return s;
  },
  getTodaySpend(){const d=this.dayData(this.currentDate);return(d.finance||[]).filter(i=>i.type!=='income').reduce((a,b)=>a+(+b.amount||0),0);},
  getMealCount(){const d=this.dayData(this.currentDate);return Object.values(d.diet||{}).filter(m=>m.name||m.img).length;},
  getExerciseMin(){const d=this.dayData(this.currentDate);let m=0;if(d.postureDone)m+=15;if(d.sportDone)m+=d.sportDone.length*3;return m;},
  exerciseDone(){const d=this.dayData(this.currentDate);return !!(d.postureDone||d.sportDone?.length);},
  getWordProgress(){const d=this.dayData(this.currentDate);const st=d.wordStatus||{};const vals=Object.values(st);if(!vals.length)return 0;return vals.filter(s=>s==='known').length/vals.length;},
  getWordProgressText(){const p=this.getWordProgress();return p>=1?'已掌握':(p>0?`已学 ${Math.round(p*100)}%`:'待学习');},
  updateHome(){if(this.currentPage==='home')this.renderPage('home');},
  openModal(title,html){$('modalContent').innerHTML=`<div class="modal-title">${title}</div>${html}`;$('modalOverlay').classList.add('show');},
  closeModal(e){if(e&&e.target!==$('modalOverlay'))return;$('modalOverlay').classList.remove('show');},
  bindKeys(){document.addEventListener('keydown',e=>{if(e.key==='Escape')this.closeModal();});}
};

App.init();
</script>
